<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0e0c">
<meta name="color-scheme" content="dark">
<meta name="description" content="Fantasy orienteering for D/H 16–21. Pick six runners, boost one, and score on real results from liveresultat.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O-Fantasy">
<title>Orienteering Fantasy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0e0c'/%3E%3Cpath d='M16 16h32v32H16z' fill='%23f4f2ec'/%3E%3Cpath d='M48 16v32H16z' fill='%23ff5a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Orienteering Fantasy. One signal colour, taken from the control flag; everything else is quiet.
   Geist for reading, Barlow Condensed for the numbers and headings people scan, Geist Mono only in tables. */
:root{
  --bg:#0d0e0c; --surface:#151613; --surface-2:#1b1d19; --surface-3:#23251f;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#edebe5; --text-2:#a9a9a1; --text-3:#7d7e77;
  --accent:#ff5a1f; --accent-press:#e84d14; --accent-ink:#160802; --accent-tint:rgba(255,90,31,.11); --accent-line:rgba(255,90,31,.42);
  --good:#56c27f; --bad:#ec5e4f; --warn:#e6aa3c;
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",var(--font);
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --r:14px; --r-sm:10px;
  --gutter:clamp(16px,4vw,32px); --tabbar:0px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-padding-top:76px;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;padding-bottom:calc(56px + var(--tabbar))}
.container{width:100%;max-width:1120px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button,[role="button"],.btn,.tag,nav button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
h2{font:600 clamp(26px,3.4vw,34px)/1.05 var(--display);letter-spacing:.005em;text-transform:uppercase;margin:36px 0 14px}
h3{font-size:15px;margin:0 0 8px;letter-spacing:-.01em}
p{text-wrap:pretty}
.eyebrow,.next-k,.facts span,th,.stats span,.hl>span:first-child{font:600 11px/1.3 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sub{color:var(--text-2);font-size:13px;overflow-wrap:anywhere}
.note{color:var(--text-2);font-size:13.5px}
.lead{color:var(--text-2);margin:0 0 16px;max-width:62ch}
.up,.pos{color:var(--good)} .dn,.neg{color:var(--bad)} .pos,.neg{font-weight:600}

/* ---------- header ---------- */
.nav{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:rgba(13,14,12,.86);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:28px;height:60px}
.logo{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;background:none;border:0;padding:0;color:var(--text)}
.logo svg{flex:none;display:block}
.logo b{font:700 20px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.logo b span{color:var(--text-3);font-weight:600}
nav.tabs{display:flex;gap:2px}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--text-2);font-size:14px;font-weight:500;white-space:nowrap;transition:color .15s,background-color .15s}
nav.tabs button[aria-selected="true"]{color:var(--text);background:var(--surface-2)}
nav.tabs svg{display:none}
.tabbar{display:none}
#mgr{margin-left:auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:0;border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:500;background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);transition:transform .1s var(--ease-out),background-color .15s}
#mgr:active{transform:scale(.97)}
#mgr .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--display);background:var(--surface-3);color:var(--text)}
#mgr.out{padding:8px 14px;background:var(--text);color:var(--bg);font-weight:600;box-shadow:none}
#mgr .badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 11px/18px var(--font);text-align:center}
@media (hover:hover) and (pointer:fine){nav.tabs button:hover{color:var(--text)}#mgr:not(.out):hover{background:var(--surface-3)}}
/* phones: tabs move to a bottom bar, like an installed app */
@media (max-width:760px){
  :root{--tabbar:calc(58px + env(safe-area-inset-bottom,0px))}
  .nav-inner{height:54px}
  .logo b{font-size:18px}
  /* the bar lives outside the header: the header's backdrop-filter would otherwise become its containing block */
  .nav nav.tabs{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:rgba(17,18,16,.94);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line)}
  .tabbar button{flex:1;display:grid;justify-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:500;border-radius:10px;color:var(--text-3);background:none;border:0;transition:color .15s}
  .tabbar button[aria-selected="true"]{color:var(--text)}
  .tabbar button[aria-selected="true"] svg{color:var(--accent)}
  .tabbar svg{display:block;width:22px;height:22px}
  #mgr .nm{max-width:9ch;overflow:hidden;text-overflow:ellipsis}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:14px;line-height:1;border-radius:var(--r-sm);padding:11px 16px;border:0;background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .1s var(--ease-out),background-color .15s,color .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:none}
.btn.go{width:100%;padding:15px 20px;font-size:15px;font-weight:600;background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.go:disabled{background:var(--surface-3);color:var(--text-3);opacity:1}
.btn.quiet{background:none;box-shadow:none;color:var(--text-2);padding:8px 4px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.btn.light{background:var(--text);color:var(--bg);font-weight:600;box-shadow:none}
@media (hover:hover) and (pointer:fine){.btn:hover:not(:disabled){background:var(--surface-3)}.btn.on:hover:not(:disabled),.btn.go:hover:not(:disabled){background:var(--accent-press)}.btn.light:hover:not(:disabled){background:#fff}.btn.quiet:hover:not(:disabled){background:none;color:var(--text)}}

/* ---------- page head: round banner, stats, season course ---------- */
main#view{padding-top:20px}
.next{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:22px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.next-main{display:grid;gap:6px;min-width:0}
.next-k{color:var(--accent)}
.next-main b{font:600 clamp(30px,5vw,46px)/1 var(--display);text-transform:uppercase;letter-spacing:.005em}
.next-side{text-align:right;display:grid;gap:2px}
.next-side .num{font-size:30px;line-height:1}
.livestrip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);margin:0 0 16px}
.livestrip b{font:600 24px/1 var(--display)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 6px;box-shadow:inset 0 0 0 1px var(--line)}
.facts:empty{display:none}
.facts>div{background:var(--surface);padding:14px 16px;min-width:0}
.facts b{display:block;margin-top:6px;font:600 28px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts b{font-size:24px}}
.course{margin:6px 0 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.course:empty{display:none}
.course svg{display:block;min-width:700px;width:100%;height:auto}
.course .leg{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}
.course .leg.todo{stroke:var(--text-3);stroke-opacity:.45;stroke-dasharray:1 6}
.course .ctl{cursor:pointer}
.course .ctl circle{fill:var(--bg);stroke:var(--accent);stroke-width:1.8}
.course .ctl:not(.done):not(.now) circle{stroke:var(--text-3)}
.course .ctl.done circle{fill:var(--accent)}
.course .ctl.now circle{stroke-width:2.6}
.course .ctl text{font:600 13px var(--display);fill:var(--text-2);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.course .ctl.done text{fill:var(--accent-ink)}.course .ctl.now text{fill:var(--accent)}
.course .ctl .pts{font:500 11px var(--font);fill:var(--text-3)}
.course .ctl.done .pts{fill:var(--text);font-weight:600}
.course .ring{display:none}
.course .fin,.course .sta{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round}

/* ---------- layout ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:18px 20px;margin-bottom:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid2 .card{margin-bottom:0}
.grid2+.grid2,.grid2+.card,.card+.grid2{margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:18px;display:grid;gap:16px}
@media (max-width:900px){.side{position:static}}
.side dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.side dt{color:var(--text-2)}.side dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .btn{padding:9px 12px;font-size:13px}
.errs{margin:0;padding-left:18px;color:var(--bad);font-size:13.5px}
.fixtures{display:grid;gap:0}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px}
.fixtures .tag{display:flex;justify-content:space-between;background:none;box-shadow:none;border-radius:0;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.fixtures .tag:first-child{border-top:0;padding-top:0}
.tag.w{color:var(--accent);font-weight:600}
.fixtures .tag.w{background:none;box-shadow:none}

/* ---------- squad ---------- */
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
@media (max-width:520px){.squad{grid-template-columns:1fr 1fr;gap:8px}}
.rc{position:relative;border-radius:var(--r);padding:14px;min-width:0;display:grid;gap:10px;align-content:start;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.rc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rc .who{font-size:15px;line-height:1.25}
.rc .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc .cls{font:600 12px/1 var(--display);letter-spacing:.06em;padding:4px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-2)}
.rc .price{font:600 19px/1 var(--display);text-align:right}
.rc .price small{display:block;margin-top:3px;font:500 11px var(--font)}
.rc .rm{width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--text-3);font-size:18px;line-height:1;display:grid;place-items:center;padding:0;transition:background-color .15s,color .15s}
@media (hover:hover) and (pointer:fine){.rc .rm:hover{background:var(--surface-3);color:var(--text)}}
.rc.slot{place-items:center;min-height:200px;text-align:center;color:var(--text-3);background:none;box-shadow:inset 0 0 0 1px var(--line-2);font-size:13.5px;border-radius:var(--r)}
.rc.slot{background-image:linear-gradient(var(--bg),var(--bg));box-shadow:none;border:1px dashed var(--line-2)}
.rc.slot b{display:block;font:500 28px/1 var(--display);color:var(--text-3);margin-bottom:6px}
.rc.boosted{box-shadow:inset 0 0 0 1px var(--accent-line);background:linear-gradient(180deg,var(--accent-tint),transparent 55%),var(--surface)}
.mult{position:absolute;top:12px;right:44px;font:700 14px/1 var(--display);letter-spacing:.04em;padding:4px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.rc .gl{display:none}
.boost{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:var(--r-sm);padding:9px 12px;font-weight:600;font-size:13px;background:var(--surface-2);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .1s var(--ease-out),background-color .15s,color .15s}
.boost svg{width:14px;height:14px;flex:none}
.boost:active:not(:disabled){transform:scale(.97)}
.boost.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.boost:disabled{cursor:default}
.boost:disabled:not(.on){opacity:.5}
@media (hover:hover) and (pointer:fine){.boost:not(.on):not(:disabled):hover{color:var(--text);background:var(--surface-3)}}
.spark{display:block}.spark rect{fill:var(--accent)}.spark rect.z{fill:var(--line-2)}.spark line{stroke:var(--line)}

/* ---------- avatars: a photo when the runner sent one, otherwise a monogram in club colours ---------- */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .26);flex:none;position:relative;overflow:hidden;display:grid;place-items:center;background:hsl(var(--h,30) 28% 21%);color:hsl(var(--h,30) 70% 80%);font:600 calc(var(--s) * .42)/1 var(--display);letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.av.sm{--s:32px}.av.lg{--s:72px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.av.ph{background:var(--surface-3)}
td .who-wrap,.who-wrap{display:flex;align-items:center;gap:10px;min-width:0}

/* ---------- market ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.filters input[type=search],.filters select,input.name{background:var(--surface);color:var(--text);border:0;box-shadow:inset 0 0 0 1px var(--line-2);padding:11px 14px;border-radius:var(--r-sm);min-width:0;font:inherit;font-size:16px;transition:box-shadow .15s}
.filters input[type=search]{flex:1 1 220px}
.filters input:focus,.filters select:focus,input.name:focus{outline:none;box-shadow:inset 0 0 0 1px var(--accent)}
.filters input::placeholder,input.name::placeholder{color:var(--text-3)}
.filters label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2)}
.filters input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.tbl{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);overscroll-behavior-x:contain}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 14px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0}
th:first-child,td:first-child{text-align:left}
th{background:var(--surface);font-size:10.5px}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
td{font-size:13.5px;font-variant-numeric:tabular-nums}
td .who{font-size:14.5px}
tr.in td{background:var(--accent-tint)}
.who{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:16px;letter-spacing:-.01em;overflow-wrap:anywhere;color:var(--text)}
@media (hover:hover) and (pointer:fine){.who:hover{color:var(--accent)}}

/* ---------- rounds ---------- */
.rhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.score{font:600 clamp(64px,10vw,96px)/.9 var(--display);letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.pn{display:flex;gap:6px}
.ev{display:flex;gap:6px 14px;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.pts-big{font:600 22px/1 var(--display);font-variant-numeric:tabular-nums}

/* ---------- sheets: centred dialog on desktop, bottom sheet on phones ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;overscroll-behavior:contain}
.modal .sheet{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2),0 30px 80px -20px rgba(0,0,0,.8);border-radius:18px;width:100%;max-width:680px;padding:22px;margin-top:4vh}
.modal .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal h2{margin:0;font-size:30px}
@media (max-width:640px){
  .modal{align-items:flex-end;padding:0}
  .modal .sheet{max-width:none;margin:0;border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;overscroll-behavior:contain;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .modal .sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:-6px auto 12px}
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:16px 0}
.stats>div{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px}
.stats b{display:block;font:600 24px/1.05 var(--display);font-variant-numeric:tabular-nums;margin-bottom:4px}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:fade .18s ease-out}
  .modal .sheet{animation:sheetIn .24s var(--ease-out)}
  @keyframes fade{from{opacity:0}}
  @keyframes sheetIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
}
@media (prefers-reduced-motion:no-preference) and (max-width:640px){
  .modal .sheet{animation:sheetUp .32s var(--ease-drawer)}
  @keyframes sheetUp{from{transform:translateY(100%)}}
}

/* ---------- misc ---------- */
.bars svg{display:block;width:100%;min-width:520px}
.bars text{fill:var(--text-3);font:500 11px var(--font)}
.bars rect{fill:var(--accent)} .bars line{stroke:var(--line)}
ul.rules{padding-left:18px;margin:6px 0}ul.rules li{margin:9px 0;max-width:70ch;color:var(--text-2)}ul.rules li b{color:var(--text);font-weight:600}
.lb{list-style:none;padding:0;margin:8px 0 0}
.lb li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
input.name{width:100%;max-width:360px}
.field{display:grid;gap:6px;margin-bottom:10px}
.field label{font-size:13px;color:var(--text-2)}

/* page change: a short fade so the swap is not jarring; never on ordinary clicks */
@media (prefers-reduced-motion:no-preference){
  .enter #view{animation:viewIn .22s var(--ease-out)}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px)}}
}

/* intro for new visitors */

/* ---------- team ---------- */
function spark(i,r){
  const h=E.visible(i,r).slice(-6).map(x=>x.pts);if(!h.length)return `<span class="note">no results</span>`;

}
function squadCard(i,k,show,locked){
  const r=pr(),s=E.stats(i,r),d=r>0?E.price(i,r)-E.price(i,r-1):0,on=show.captain===i,m=show.chip==="tc"?3:2;

   ${on?`<span class="mult">${m}x</span>`:""}<span class="gl"></span>

   <div style="min-width:0"><button class="who" data-prof="${i}">${esc(nameOf(i))}</button><div class="sub">${esc(clubOf(i))}</div></div>
   <div class="meta"><span class="cls">${D.runners[i].k}</span>${spark(i,r)}</div>
   <div class="meta"><span class="sub">${s.starts} starts, form ${fp(s.form)}</span><span class="price">${fp(E.price(i,r))}M<small class="${d>0?"up":d<0?"dn":""}">${d?(d>0?"+":"-")+fp(Math.abs(d)):"same"}</small></span></div>
   <button class="boost ${on?"on":""}" data-boost="${i}" ${locked?"disabled":""} aria-pressed="${on}" aria-label="${on?esc(nameOf(i))+" is boosted":"Boost "+esc(nameOf(i))}">${BOLT}${on?"Boosted "+m+"x":"Boost"}</button></div>`;

function canAddReason(i){
  if(plan.squad.length>=D.squad)return "Squad is full";
  if(clubCount(plan.squad,i)>=D.clubMax)return "Max "+D.clubMax+" from one club";
  if(E.bankAfter(state,[...plan.squad,i])<0)return "Not enough budget";
  return "";
}
function marketRows(){
  const r=pr();let rows=[];
  for(let i=0;i<E.N;i++){if(!D.runners[i].p)continue;
    if(q&&!(nameOf(i)+" "+clubOf(i)).toLowerCase().includes(q))continue;
    if(clubF&&clubOf(i)!==clubF)continue;
    if(clsF&&(clsF.length===1?D.runners[i].k[0]!==clsF:D.runners[i].k!==clsF))continue;
    const s=E.stats(i,r),p=E.price(i,r);
    if(afford&&!plan.squad.includes(i)&&E.bankAfter(state,[...plan.squad,i])<0)continue;
    rows.push({i,s,p,d:r>0?p-E.price(i,r-1):0,n:nameOf(i),avg:s.starts?s.total/s.starts:0});
  }
  const v={price:x=>x.p,form:x=>x.s.form,total:x=>x.s.total,avg:x=>x.avg,starts:x=>x.s.starts,name:x=>x.n.toLowerCase()}[sortKey];
  rows.sort((a,b)=>{const x=v(a),y=v(b);return (x<y?-1:x>y?1:0)*sortDir||a.i-b.i});
  return rows;
}
function marketHtml(){
  const rows=marketRows();const clubs=[...new Set(D.runners.filter(x=>x.p).map(x=>x.c))].sort((a,b)=>a.localeCompare(b,"sv"));

   <select id="clsF" aria-label="Class"><option value="">All classes</option>${["H","D","H16","H18","H20","H21","D16","D18","D20","D21"].map(c=>`<option value="${c}" ${c===clsF?"selected":""}>${c==="H"?"All men (H)":c==="D"?"All women (D)":c}</option>`).join("")}</select>
   <select id="clubF" aria-label="Club"><option value="">All clubs</option>${clubs.map(c=>`<option ${c===clubF?"selected":""}>${esc(c)}</option>`).join("")}</select>

  ${rows.slice(0,shown).map(x=>{const inS=plan.squad.includes(x.i),why=inS?"":canAddReason(x.i);
   return `<tr class="${inS?"in":""} ${justAdded===x.i?"pop":""}"><td><div class="who-wrap">${avatar(x.i,"sm")}<div><button class="who" data-prof="${x.i}">${esc(x.n)}</button><div class="sub">${D.runners[x.i].k}, ${esc(clubOf(x.i))}</div></div></div></td><td><b>${fp(x.p)}M</b></td><td class="${x.d>0?"up":x.d<0?"dn":""}">${x.d?(x.d>0?"+":"-")+fp(Math.abs(x.d)):"–"}</td><td>${fp(x.s.form)}</td><td>${spark(x.i,pr())}</td><td>${x.s.starts?fp(x.avg):"–"}</td><td>${fp(x.s.total)}</td><td>${x.s.starts}</td>
   <td>${inS?`<button class="btn" data-sell="${x.i}">Remove</button>`:`<button class="btn" data-add="${x.i}" ${why?"disabled":""} title="${esc(why)}">Add</button>`}</td></tr>`}).join("")||`<tr><td colspan="9" class="note">No runners match. Clear the search or club filter.</td></tr>`}
  </tbody></table></div>
  ${rows.length>shown?`<p><button class="btn" id="more">Show ${Math.min(40,rows.length-shown)} more</button></p>`:""}
  <p class="note">Form is the average of the last three results. Prices and stats only count races before this round.</p>`;

/* one entry per competition: results are stored per class ("Name (H16)") and some organisers publish a race twice */
const compName=n=>n.replace(/ \([DH]\d+[A-Z]*\)$/,"").replace(/\s*\((lokal kopia|local copy)[^)]*\)?\s*$/i,"").trim();
function comps(r){
  const m=new Map(),add=(name,date,tier)=>{const n=compName(name),k=n.toLowerCase()+"|"+date;const o=m.get(k);if(!o)m.set(k,{n,date,tier});else o.tier=Math.max(o.tier,tier)};
  D.rounds[r].ev.forEach(ei=>{const e=D.events[ei];add(e.name,e.date,e.tier)});
  sched(r).forEach(u=>add(u.name,u.date,1));
  return [...m.values()].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.n.localeCompare(b.n,"sv"));
}
function raceTags(r){
  const c=comps(r);
  return c.length?c.slice(0,8).map(x=>`<span class="tag ${x.tier>1?"w":""}"><span>${esc(x.n)}${x.tier>1?" · ×"+x.tier:""}</span><span class="sub" style="white-space:nowrap">${dshort(x.date)}</span></span>`).join("")+(c.length>8?`<span class="note">and ${c.length-8} more</span>`:""):`<span class="note">No races listed yet. They show up on liveresultat a few days before.</span>`;
}
function liveNow(){

}
function hero(r){

function standings(code){
  const rows=(leagueRows[code]||[]).slice(),rs=startedRounds(),cur=rs[rs.length-1],prev=rs[rs.length-2];

  rows.forEach(m=>{m.t=cur===undefined?0:tot(m,cur);m.tp=prev===undefined?0:tot(m,prev)});
  const rank=(arr,k)=>{const s=arr.slice().sort((a,b)=>b[k]-a[k]||a.name.localeCompare(b.name,"sv"));const out={};s.forEach((m,i)=>{out[m.id]=i>0&&s[i-1][k]===m[k]?out[s[i-1].id]:i+1});return out};

  rows.forEach(m=>{m.rank=now[m.id];m.move=prev===undefined?0:before[m.id]-now[m.id]});

/* square crop and re-encode in the browser: small upload, no EXIF or GPS data */
function cropPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error("Choose an image file."));return}
    if(file.size>25e6){rej(new Error("That file is too large."));return}
    const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const n=Math.min(img.naturalWidth,img.naturalHeight);if(n<120){URL.revokeObjectURL(u);rej(new Error("That photo is too small. Use one at least 120 pixels wide."));return}
      const S=Math.min(512,n),c=document.createElement("canvas");c.width=c.height=S;
      const sx=(img.naturalWidth-n)/2,sy=Math.max(0,(img.naturalHeight-n)*.3);
      c.getContext("2d").drawImage(img,sx,sy,n,n,0,0,S,S);URL.revokeObjectURL(u);
      c.toBlob(b=>b?res({blob:b,url:c.toDataURL("image/jpeg",.6)}):rej(new Error("Could not read that photo.")),"image/jpeg",.86)};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Could not read that photo."))};img.src=u;
  });
}

async function mergeLineups(){

  if(q.error)throw q.error;
  const srv={};(q.data||[]).forEach(x=>{srv[x.round]=x});
  const sp=unpackPicks(srv),o=openRound();
  Object.keys(picks).forEach(r=>{if(+r<o&&!sp[r])delete picks[r]});
  Object.keys(sp).forEach(r=>{if(+r<o||!picks[r])picks[r]=sp[r]});
  const push=Object.keys(picks).filter(r=>+r>=o).map(r=>Object.assign({user_id:cloud.uid,round:+r,updated_at:new Date().toISOString()},idsOf(picks[r])));
  const drop=Object.keys(srv).filter(r=>+r>=o&&!picks[r]);
  if(push.length){const u=await cloud.sb.from("lineups").upsert(push);if(u.error)syncMsg="Your squad is saved on this device, but not to your account yet."}
  for(const r of drop)await cloud.sb.from("lineups").delete().eq("user_id",cloud.uid).eq("round",+r);

  transition:transform .28s cubic-bezier(.3,1.4,.5,1),box-shadow .28s var(--ease-out),filter .28s,opacity .28s}
.coin .disc::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.5)}
.coin .disc::after{content:"";position:absolute;left:18%;right:18%;top:7%;height:36%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
.coin svg{position:relative;z-index:1;width:22px;height:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.coin b{font-size:11.5px;font-weight:650;line-height:1.15;text-align:center;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--text-2)}
.coin.on b{color:var(--cc)}
.coin.on .disc{transform:translateY(-3px) scale(1.08);box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -4px 8px rgba(0,0,0,.22),0 0 0 3px #fff,0 0 0 6px var(--cc),0 16px 26px -10px var(--cc)}
.coin:active:not(:disabled) .disc{transform:scale(.92)}
.coin:disabled{cursor:default}
.coin:disabled .disc{filter:grayscale(.85);opacity:.4;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 0 0 3px rgba(255,255,255,.9),0 0 0 4px rgba(15,23,42,.08)}
.coin.used b{color:var(--text-3)}
@media (hover:hover) and (pointer:fine){.coin:not(:disabled):not(.on):hover .disc{transform:translateY(-2px)}}
.chipdesc{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:8px 8px 8px 14px;border-radius:16px;font-size:13.5px;line-height:1.35;color:var(--text-2);
  background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(15,23,42,.06),inset 0 1px 0 #fff}
.chipdesc[class*="c-"]{background:color-mix(in srgb,var(--cc) 9%,rgba(255,255,255,.7));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 28%,transparent),inset 0 1px 0 #fff}
.chipdesc b{color:var(--cc,var(--text))}
.chipdesc .btn{padding:8px 12px;font-size:13px;flex:none}
@media (prefers-reduced-motion:reduce){.coin .disc{transition:box-shadow .2s,opacity .2s,filter .2s}.coin.on .disc,.coin:active:not(:disabled) .disc{transform:none}}

/* ================= phones: the numbers strip and the next round card, compact ================= */
@media (max-width:560px){
  .facts{grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-radius:18px;margin:0 0 14px;position:relative;overflow:hidden;
    background:var(--surface-grad);-webkit-backdrop-filter:var(--frost,none);backdrop-filter:var(--frost,none);
    box-shadow:var(--rim,inset 0 0 0 1px var(--line)),0 12px 30px -14px rgba(15,23,42,.22)}
  .facts>div,html.glass .facts>div{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-radius:0;padding:12px 6px 11px 10px}
  .facts>div+div{box-shadow:inset 1px 0 0 rgba(15,23,42,.07)}
  .facts>div::before{left:10px;right:auto;top:12px;bottom:auto;width:6px;height:6px;border-radius:50%}
  .facts span{display:block;padding-left:10px;font-size:9px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .facts b{font-size:20px;margin-top:5px;white-space:nowrap}
  .next{flex-wrap:nowrap;align-items:center;gap:10px;padding:14px 14px 14px 18px;margin-bottom:14px}
  .next-main{gap:3px}
  .next-main b{font-size:24px;line-height:1.05;overflow-wrap:anywhere}
  .next-main .wklink{font-size:13.5px;margin-top:2px}
  .next-k{font-size:9.5px}
  .next-side{flex:none;gap:1px}
  .next-side .num{font-size:24px}
  .next-side .sub{font-size:12px}
}

/* admins: one switch on the profile shows or hides the admin tools (hidden by default) */
.admsw{display:inline-flex;align-items:center;gap:12px;margin:0 0 16px;padding:8px 16px 8px 10px;border-radius:999px;cursor:pointer;-webkit-user-select:none;user-select:none;
  background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(15,23,42,.08),inset 0 1px 0 #fff}
.admsw input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.admsw .trk{position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:rgba(120,120,128,.24);transition:background-color .2s ease}
.admsw .trk::after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.05);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.admsw input:checked+.trk{background:var(--accent)}
.admsw input:checked+.trk::after{transform:translateX(18px)}
.admsw input:focus-visible+.trk{outline:2px solid var(--accent);outline-offset:2px}
.admsw b{display:block;font-size:14px;line-height:1.2}.admsw .sub{font-size:12px}
@media (prefers-reduced-motion:reduce){.admsw .trk::after{transition:none}}

/* ================= Liquid Glass, see-through =================
   Following Apple's regular glass: every surface lets the page behind it through, blurred and brightened, with a
   bright rim that catches the light at the edges (lensing). Soft colour light sits behind the map so the glass has
   something to refract. Glass never sits on glass: what is inside a glass panel is clear with a hairline edge.
   Reduce Transparency gets solid surfaces. */
html.glass{--surface:rgba(255,255,255,.4);--surface-2:rgba(255,255,255,.28);--surface-3:rgba(255,255,255,.2);--hdr:rgba(255,255,255,.38);
  --surface-grad:linear-gradient(160deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.32) 100%);
  --glass-bg:rgba(255,255,255,.3);--frost:blur(26px) saturate(190%) brightness(1.05);--glass-blur:blur(24px) saturate(200%) brightness(1.06);
  --rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.45),inset 1px 0 0 rgba(255,255,255,.55),inset -1px 0 0 rgba(255,255,255,.55),inset 0 0 24px rgba(255,255,255,.28)}
html.glass .terrain{background:radial-gradient(60vmax 45vmax at 8% 6%,rgba(16,185,129,.2),transparent 70%),radial-gradient(55vmax 45vmax at 96% 32%,rgba(56,189,248,.18),transparent 70%),
  radial-gradient(60vmax 50vmax at 22% 92%,rgba(250,204,21,.14),transparent 70%),radial-gradient(50vmax 40vmax at 88% 96%,rgba(167,139,250,.14),transparent 70%),var(--bg)}
html.glass .board{background:var(--surface-grad);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost);box-shadow:var(--rim),0 12px 30px -14px rgba(15,23,42,.22),0 30px 60px -36px rgba(15,23,42,.22)}
html.glass .panel .card,html.glass .panel .tbl,html.glass .side .card,html.glass .board .card,html.glass .chipdesc:not([class*="c-"]),html.glass .admsw,
html.glass .filters input[type=search],html.glass .filters select,html.glass input.name,html.glass .slot,html.glass .bd-tabs{
  background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 1px 0 rgba(255,255,255,.8),0 1px 2px rgba(15,23,42,.04)}
html.glass .tbl tbody tr,html.glass .tbl thead,html.glass th,html.glass td{background:transparent}
html.glass .tbl tbody tr+tr td,html.glass th,html.glass td{border-color:rgba(15,23,42,.06)}
html.glass .nav{background:rgba(255,255,255,.34)}
html.glass .modal .sheet{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(34px) saturate(200%) brightness(1.06);backdrop-filter:blur(34px) saturate(200%) brightness(1.06)}
html.glass .btn:not(.on):not(.go):not(.light):not(.quiet),html.glass .boost:not(.on),html.glass .sqc-ctl .sw,html.glass .sqc-ctl .rm{
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.3));-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%)}
@media (max-width:760px){html:is(.glass,.gbar) .tabbar{background:rgba(255,255,255,.26)}html:is(.glass,.gbar) .tabbar .ind{background:rgba(255,255,255,.5)}}
@media (prefers-reduced-transparency:reduce){
  html.glass{--surface:#fff;--surface-2:#f8fafc;--surface-3:#eef1f5;--hdr:rgba(255,255,255,.96);--surface-grad:linear-gradient(180deg,#fff,#f8fafc)}
  html.glass .board,html.glass .btn,html.glass .boost,html.glass .modal .sheet{-webkit-backdrop-filter:none;backdrop-filter:none}
  html.glass .modal .sheet{background:#fff}
}

/* the tab bar, as on iOS: press and slide a finger along it, the glass lens follows and lifts; let go on a tab to open it */
@media (max-width:760px){
  .tabbar{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .tabbar .ind{transition:scale .22s cubic-bezier(.3,1.4,.5,1),opacity .2s,background-color .2s}
  .tabbar .ind.lift{scale:1.16 1.1;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.9),0 10px 24px -8px rgba(15,23,42,.35)}
  .tabbar button.hov{color:var(--accent)}
  .tabbar.dragging button{transition:color .12s}
}

/* privacy: deleting an account asks once more, in red */
.delbox{margin-top:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 35%,transparent)}
.btn.danger{background:#dc2626;color:#fff;box-shadow:0 8px 18px -10px #dc2626}
.adm-row.col{flex-direction:column;align-items:stretch;gap:8px}
.flagtag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#b91c1c;background:rgba(220,38,38,.1)}
.card.admin details summary{cursor:pointer;color:var(--text-2);font-size:14px}

/* the forced rename: red and serious. A blood-red sheet over a red-tinted page, a pulsing warning sign, one shake. */
.modal:has(.sheet[data-key="rename"]){background:rgba(69,10,10,.62)!important;-webkit-backdrop-filter:blur(6px) saturate(140%);backdrop-filter:blur(6px) saturate(140%)}
#modal .sheet[data-key="rename"],html.glass #modal .sheet[data-key="rename"]{color:#fff;background:radial-gradient(120% 70% at 50% 0%,#dc2626 0%,#991b1b 45%,#450a0a 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(254,202,202,.25),0 0 0 2px #ef4444,0 0 60px -6px rgba(239,68,68,.75),0 30px 60px -20px rgba(0,0,0,.6)}
.sheet[data-key="rename"] .rn-warn{display:grid;justify-items:center;text-align:center;gap:4px;margin:4px 0 14px}
.sheet[data-key="rename"] .rn-warn svg{width:64px;height:64px;color:#fecaca;filter:drop-shadow(0 0 14px rgba(254,202,202,.7))}
.sheet[data-key="rename"] .rn-k{font:700 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fecaca}
.sheet[data-key="rename"] h2{margin:0;font-size:38px;line-height:1;color:#fff;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 24px rgba(254,202,202,.45)}
.sheet[data-key="rename"] .rn-p{margin:0 0 16px;color:#fee2e2;text-align:center}
.sheet[data-key="rename"] .rn-p b{color:#fff}
.sheet[data-key="rename"] label{color:#fecaca}
.sheet[data-key="rename"] input.name{background:rgba(0,0,0,.28)!important;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(254,202,202,.55)!important}
.sheet[data-key="rename"] input.name:focus{box-shadow:inset 0 0 0 2px #fff,0 0 0 4px rgba(255,255,255,.18)!important;outline:none}
.sheet[data-key="rename"] .row{justify-content:center}
.sheet[data-key="rename"] #rnSave{background:#fff!important;color:#991b1b!important;font-weight:800;padding:13px 34px;box-shadow:0 10px 26px -8px rgba(0,0,0,.55)!important}
.sheet[data-key="rename"] .note{color:#fff!important;text-align:center;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .sheet[data-key="rename"]{animation:rnShake .55s cubic-bezier(.36,.07,.19,.97) .35s both}
  .sheet[data-key="rename"] .rn-warn svg{animation:rnPulse 1.6s ease-in-out infinite}
  @keyframes rnShake{10%,90%{translate:-2px 0}20%,80%{translate:4px 0}30%,50%,70%{translate:-7px 0}40%,60%{translate:7px 0}}
  @keyframes rnPulse{0%,100%{scale:1;opacity:1}50%{scale:1.1;opacity:.82}}
}

/* ================= Fantasy Orientering: in the style of orientering.se =================
   Gotham-like geometric type (Montserrat), black, white and light grey with Svensk Orientering's yellow and navy,
   flat surfaces, pill buttons in capitals, big rounded corners and the navy corner triangle on grey boxes.
   The runner cards keep their own condensed type. */
:root,:root[data-theme]{--font:"Montserrat","Gotham",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:var(--font);
  --display:"Montserrat","Gotham",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#ffffff;--surface:#ffffff;--surface-2:#f2f2f2;--surface-3:#ededed;--surface-grad:#f2f2f2;
  --text:#000;--text-2:#595959;--text-3:#8f8f8f;--line:#dadada;--line-2:#a7a7a7;
  --accent:#003c68;--accent-ink:#fff;--accent-press:#16283e;--accent-tint:rgba(0,60,104,.08);--accent-line:rgba(0,60,104,.35);
  --gul:#ffe74d;--gul-2:#ffe01a;--navy:#003c68;--navy-2:#16283e;
  --c2:#003c68;--c3:#ffc050;--contour:#d4d4d4;--hdr:#fff;--shadow:none;--shadow-lift:0 10px 30px -14px rgba(0,0,0,.25);--r:30px;--r-sm:999px}
.lc,.sqc,.lineup,.squad,.bd-score,.sqc-sh{--display:"Barlow Condensed","Arial Narrow",sans-serif}
body{letter-spacing:0}
.terrain{background:#fff}.terrain svg{opacity:.35}
h1,h2,.intro h1,.modal h2,.next-main b,.teamhead b,.welcome h2{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
h2::after,.pg-k+h2::after{display:none!important}
.eyebrow,.next-k,.facts span,th,.stats span,.kv span,.hl>span:first-child{font-family:var(--font);font-weight:600;letter-spacing:.08em;color:var(--text-2)}
.pg-k{color:#000!important}
/* header: a black utility bar, then white with the logo and plain navigation */
.nav{background:#fff!important;box-shadow:0 1px 0 #ededed!important;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.topbar{background:#000;color:#fff;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.topbar .container{display:flex;align-items:stretch;justify-content:space-between;min-height:28px}
.topbar .sect{display:flex;align-items:center;background:var(--gul);color:#000;font-weight:700;padding:0 18px}
.topbar .tb-r{display:flex;align-items:center;font-weight:500;opacity:.85}
.logo{gap:10px}.logo .mark{flex:none;border-radius:9px}
.logo b{font-family:var(--font);font-weight:800;font-size:18px;letter-spacing:-.01em;color:#000;text-transform:none}
.logo b .w1{font-weight:500}.logo b .w2{font-weight:800}.logo b span{color:#000!important}
nav.tabs button{font-family:var(--font);font-weight:500;color:#000;font-size:15px}
nav.tabs button[aria-selected="true"]{font-weight:700}
nav.tabs .ind{background:var(--gul)!important;height:4px!important;bottom:0!important;border-radius:0!important}
#mgr.out,#mgr{border-radius:999px}
#mgr.out{background:var(--gul)!important;color:#000!important;text-transform:uppercase;font-size:12.5px;letter-spacing:.06em;font-weight:700;box-shadow:none!important}
/* buttons: pills in capitals. Yellow fills the main action, the rest are outlined in black */
.btn{border-radius:999px!important;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;font-weight:600;font-family:var(--font);
  background:#fff!important;color:#000!important;box-shadow:inset 0 0 0 1px #000!important;padding:12px 20px}
.btn.on,.btn.go,.btn.light,.boost.on,.bd-tabs button.on,.seg button.on{background:var(--gul)!important;color:#000!important;box-shadow:none!important}
@media (hover:hover) and (pointer:fine){.btn:hover{background:#000!important;color:#fff!important}.btn.on:hover,.btn.go:hover{background:var(--gul-2)!important;color:#000!important}}
.btn.quiet{box-shadow:none!important;text-decoration:underline;text-underline-offset:3px}
.btn.danger{background:#c81e1e!important;color:#fff!important}
/* surfaces: grey boxes with square corners and the navy corner triangle, white cards with big round corners */
.panel,.side{background:#f2f2f2!important;border-radius:0!important;box-shadow:none!important}.panel{position:relative}
@media (max-width:900px){.side{position:relative!important;top:auto!important}}   /* the corner triangle needs a positioned box */
.panel::before,.side::before{content:"";position:absolute;right:0;top:0;width:34px;height:34px;background:linear-gradient(225deg,var(--navy) 50%,transparent 50%);pointer-events:none}
.card,.kv>div,.hl,.livestrip,.rc:not([class*="tier-"]):not(.slot){background:#fff!important;border-radius:30px!important;box-shadow:none!important}
#view>.card,#view .grid2>.card{background:#f2f2f2!important}
.panel .card,.side .card{background:#fff!important}
.tbl{background:#fff!important;border-radius:30px!important;box-shadow:none!important}
th{background:#fff;color:#595959;font-size:11px}
td,th{border-color:#ededed!important}
/* the numbers: a yellow block, as orientering.se's yellow panels */
.facts>div{background:var(--gul)!important;border-radius:0!important;box-shadow:none!important;color:#000}
.facts>div::before{display:none}
.facts span{color:#000!important;opacity:.75}
.facts b{font-family:var(--font);font-weight:800;color:#000}
@media (max-width:560px){.facts{background:var(--gul)!important;border-radius:0 0 30px 30px!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .facts>div+div{box-shadow:inset 1px 0 0 rgba(0,0,0,.12)!important}}
/* the next round: the black caption box from orientering.se's big picture */
.next{background:#000!important;color:#fff;border-radius:0 0 50px 50px!important;box-shadow:none!important}
.next::before{background:var(--gul)!important;width:8px!important}
.next .next-k{color:var(--gul)!important}.next-main b{color:#fff}.next .wklink{color:#fff;text-decoration:underline;text-underline-offset:4px}
.next-side .eyebrow,.next-side .sub{color:#d4d4d4!important}.next-side .num{color:#fff}
.next.skip::before{background:#ff9540!important}
/* the season course and other accents in navy and yellow */
.course svg .c,.course svg circle{stroke:var(--navy)}
.livedot{background:var(--gul);color:#000}
/* the runner list and filters */
.filters input[type=search],.filters select,input.name{border-radius:999px!important;background:#fff!important;box-shadow:inset 0 0 0 1px #000!important;font-family:var(--font)}
.mkt-panel .tbl{box-shadow:none!important}
/* bottom tab bar on phones: the Liquid Glass bar, in the site's type, the selected icon in navy */
@media (max-width:760px){
  .tabbar button{font-family:var(--font);font-weight:500}
  .tabbar button[aria-selected="true"]{font-weight:700;color:var(--navy)!important}
  .topbar .tb-r{display:none}
  .facts span{font-size:8.5px;letter-spacing:.04em}
}
/* the rounds board, chips and modal sheets */
.board{background:#f2f2f2!important;border-radius:30px!important;box-shadow:none!important}
.modal .sheet:not([data-key="rename"]){background:#fff!important;border-radius:30px 30px 0 0!important}
@media (min-width:641px){.modal .sheet:not([data-key="rename"]){border-radius:30px!important}}
.chipdesc[class*="c-"]{border-radius:20px}
/* a fan project, not Svensk Orientering's site */
.fanline{margin:40px 0 0;padding:22px 0 8px;border-top:1px solid #ededed;color:#595959;font-size:12.5px;text-align:center}

/* ---- orientering.se, more of it ---- */
/* the big picture: an O-map with big round bottom corners and the black caption box in the corner */
.next.omhero{position:relative;display:block;min-height:clamp(250px,30vw,380px);padding:0!important;margin:0 0 26px;border-radius:0 0 50px 50px!important;
  background:var(--om)!important;overflow:hidden;color:#fff}
.next.omhero::before{display:none!important}
.next.omhero .next-main{position:absolute;left:0;bottom:0;display:grid;gap:6px;max-width:min(560px,88%);background:#000;padding:20px 28px 22px;border-radius:0 0 0 50px}
.next.omhero .next-main b{font-family:var(--font);font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.15;color:#fff}
.next.omhero .next-k{font-size:11px;color:var(--gul)!important;letter-spacing:.08em}
.next.omhero .wklink{font-size:14px;color:#fff;text-decoration:none;margin-top:4px}
@media (hover:hover) and (pointer:fine){.next.omhero .wklink:hover{text-decoration:underline}}
.next.omhero .next-side{position:absolute;top:16px;right:16px;display:flex;align-items:baseline;gap:6px;background:var(--gul);color:#000;border-radius:999px;padding:8px 16px;text-align:left}
.next.omhero .next-side .eyebrow{color:#000!important;opacity:.7;font-size:10.5px}
.next.omhero .next-side .num{font-family:var(--font);font-weight:800;font-size:16px;color:#000}
.next.omhero .next-side .sub{color:#000!important;font-size:12px;opacity:.75}
.next.omhero.skip .next-side{background:#ff9540}
/* this week's races: cards with a map on top, a hairline, a small category and date row and a bold name */
.news{margin:0 0 30px}
.news-hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.news-hd h2{margin:0;font-size:clamp(24px,2.4vw,30px)}
.news-hd .sub{color:#595959;font-size:13px}
.news-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.ncard{min-width:0;width:100%;display:grid;align-content:start;gap:0;padding:0;border:0;background:#f2f2f2;border-radius:30px;overflow:hidden;text-align:left;font:inherit;color:#000;cursor:pointer}
.ncard .nimg{display:block;aspect-ratio:48/25;max-width:100%;background-size:cover;background-position:center;border-bottom:1px solid #000}
.ncard .nrow{display:flex;justify-content:space-between;gap:8px;padding:12px 16px 0;font-size:11.5px;color:#595959}

const D=/*DATA*/null;

const E=makeEngine(D);
const $=s=>document.querySelector(s);

const fp=x=>String(Math.round(x/10));
const sg=x=>(x>0?"+":"")+fp(x);
const tm=t=>{const s=t/100,m=Math.floor(s/60);return m+":"+String(Math.floor(s%60)).padStart(2,"0")};
const MON=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const dshort=d=>{const [,m,dd]=d.split("-");return +dd+" "+MON[+m-1]};
const KEY="orienteering-fantasy-v5"; /* v5: ten runners, A and B teams, prices in thousands */
const RM=(()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return true}})();
const FINE=(()=>{try{return matchMedia("(hover: hover) and (pointer: fine)").matches}catch(e){return false}})();
const hsh=s=>{let h=2166136261;for(let k=0;k<s.length;k++){h^=s.charCodeAt(k);h=Math.imul(h,16777619)}return h>>>0};
/* a photo when the runner sent one, otherwise their initials on their club's colour */
function avatar(i,cls){
  const r=D.runners[i],ph=photoUrl.get(r.id)||r.ph;
  if(ph)return `<div class="av ph ${cls||""}" aria-hidden="true"><img src="${esc(ph)}" alt="" loading="lazy" decoding="async"></div>`;
  const ini=r.n.split(/\s+/).filter(Boolean).map(w=>w[0]).filter((c,k,a)=>k===0||k===a.length-1).join("").toUpperCase();
  return `<div class="av ${cls||""}" style="--h:${hsh(r.c)%360}" aria-hidden="true">${esc(ini)}</div>`;
}
/* photos runners sent themselves (or a parent did), shown once approved */
const photoUrl=new Map();
let myPhotos=[],pendingPhotos=[],phForm=null,phMsg="",phBusy=false;
const avPublic=path=>SB_URL+"/storage/v1/object/public/avatars/"+path.split("/").map(encodeURIComponent).join("/");
const photoPublic=path=>SB_URL+"/storage/v1/object/public/runner-photos/"+path.split("/").map(encodeURIComponent).join("/");
const youthCls=i=>/^[DH](16|18)$/.test(D.runners[i].k);
/* ---------- themes ---------- */
const THEMES=[["light","Ljust","#ffffff",["#f5f7fa","#cbd5e1","#059669","#0d9488"]],["dark","Mörkt","#0b1120",["#0b1120","#334155","#34d399","#2dd4bf"]]];
const curTheme=()=>document.documentElement.dataset.theme||"light";
function setTheme(name,from){
  const t=THEMES.find(x=>x[0]===name)||THEMES[0];
  const apply=()=>{document.documentElement.dataset.theme=t[0];const m=document.getElementById("themeColor");if(m)m.content=t[2];try{localStorage.setItem("of-theme",t[0])}catch(e){}if(tab==="profile")render()};
  if(RM||!document.startViewTransition||!from){apply();return}
  const b=from.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(apply);
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:650,easing:"cubic-bezier(.77,0,.175,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
}
{const t=THEMES.find(x=>x[0]===curTheme());const m=document.getElementById("themeColor");if(t&&m)m.content=t[2]}
/* ---------- the map behind the page: contour lines around a few hills, every fifth one an index contour ---------- */
function drawTerrain(){
  /* contour lines traced (marching squares) from one height field made of a few hills and gentle ridges, the way a
     real map works: lines of different heights can never cross. Every fifth line is an index contour. */
  const el=document.getElementById("terrain");if(!el)return;
  const W=1600,H=1000,G=14,nx=Math.ceil(W/G)+1,ny=Math.ceil(H/G)+1,rnd=Math.random;
  const hills=[];for(let k=0;k<7;k++)hills.push({x:rnd()*W,y:rnd()*H,a:(rnd()<.8?1:-.6)*(60+rnd()*90),sx:140+rnd()*260,sy:120+rnd()*220,r:rnd()*Math.PI});
  const ph=[rnd()*6,rnd()*6];
  const h=new Float32Array(nx*ny);let lo=1e9,hi=-1e9;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const x=i*G,y=j*G;let v=12*Math.sin(x/430+ph[0])+10*Math.cos(y/370+ph[1]);
    for(const q of hills){const c=Math.cos(q.r),s2=Math.sin(q.r),dx=x-q.x,dy=y-q.y,u=(dx*c+dy*s2)/q.sx,w=(-dx*s2+dy*c)/q.sy;v+=q.a*Math.exp(-(u*u+w*w))}
    h[j*nx+i]=v;if(v<lo)lo=v;if(v>hi)hi=v}
  const step=(hi-lo)/26;let out="";
  for(let L=1;L<26;L++){
    const z=lo+L*step,segs=[];
    const P=(i1,j1,i2,j2)=>{const a=h[j1*nx+i1],b=h[j2*nx+i2],t=(z-a)/(b-a);return [(i1+(i2-i1)*t)*G,(j1+(j2-j1)*t)*G]};
    for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
      const a=h[j*nx+i]>z,b=h[j*nx+i+1]>z,c=h[(j+1)*nx+i+1]>z,d=h[(j+1)*nx+i]>z,k=(a?8:0)|(b?4:0)|(c?2:0)|(d?1:0);
      if(k===0||k===15)continue;
      const T=()=>P(i,j,i+1,j),R=()=>P(i+1,j,i+1,j+1),B=()=>P(i,j+1,i+1,j+1),Lf=()=>P(i,j,i,j+1);
      switch(k){case 1:case 14:segs.push([Lf(),B()]);break;case 2:case 13:segs.push([B(),R()]);break;case 3:case 12:segs.push([Lf(),R()]);break;
        case 4:case 11:segs.push([T(),R()]);break;case 6:case 9:segs.push([T(),B()]);break;case 7:case 8:segs.push([Lf(),T()]);break;
        case 5:segs.push([Lf(),T()],[B(),R()]);break;case 10:segs.push([T(),R()],[Lf(),B()]);break}
    }
    /* join the little pieces into lines and draw them as smooth curves */
    const key=p=>p[0].toFixed(1)+","+p[1].toFixed(1),ends=new Map();
    segs.forEach((sg,n)=>{for(const e of [0,1]){const kk=key(sg[e]);(ends.get(kk)||ends.set(kk,[]).get(kk)).push(n)}});
    const used=new Uint8Array(segs.length);let d="";
    for(let n=0;n<segs.length;n++){if(used[n])continue;used[n]=1;let line=[segs[n][0],segs[n][1]];
      for(const dir of [1,0]){let grow=true;while(grow){grow=false;const endp=dir?line[line.length-1]:line[0];for(const m of ends.get(key(endp))||[]){if(used[m])continue;used[m]=1;const sg=segs[m],nxt=key(sg[0])===key(endp)?sg[1]:sg[0];dir?line.push(nxt):line.unshift(nxt);grow=true;break}}}
      if(line.length<4)continue;
      d+="M"+line[0][0].toFixed(1)+" "+line[0][1].toFixed(1);
      for(let q=1;q<line.length-1;q++){const m0=(line[q][0]+line[q+1][0])/2,m1=(line[q][1]+line[q+1][1])/2;d+="Q"+line[q][0].toFixed(1)+" "+line[q][1].toFixed(1)+" "+m0.toFixed(1)+" "+m1.toFixed(1)}
      d+="L"+line[line.length-1][0].toFixed(1)+" "+line[line.length-1][1].toFixed(1);
    }
    if(d)out+=`<path class="${L%5===0?"ix":""}" d="${d}"/>`;
  }
  el.setAttribute("viewBox",`0 0 ${W} ${H}`);el.innerHTML=out;
}
drawTerrain();
/* opening titles: on every page load (a reload too), never when arriving from an email or invite link, never with

let reelEnd=0;
(function reel(){
  if(RM||/access_token|error=|join=/.test(location.href))return;
  let n=0;const word=w=>[...w].map(c=>`<span style="--i:${n++}">${c}</span>`).join("");
  const letters=word("Fantasy")+`<span class="sp" style="--i:${n++}"></span><em>${word("Orientering")}</em>`;
  const T=document.getElementById("terrain"),vb=T?T.getAttribute("viewBox")||"0 0 1600 1000":"0 0 1600 1000",[,,VW,VH]=vb.split(" ").map(Number);
  const sw=1/Math.max(innerWidth*1.2/VW,innerHeight*1.2/VH);
  const r=document.createElement("div");r.id="reel";r.setAttribute("aria-hidden","true");
  r.innerHTML=`<svg class="map" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" style="--sw:${sw.toFixed(3)}">${T?T.innerHTML:""}</svg>
   <div class="in"><svg class="leg" viewBox="0 0 200 60"><path class="st" pathLength="1" d="M22 15.5 34 36.5H10Z"/><path class="ln" pathLength="1" d="M40 30H150"/>
    <circle class="ping" cx="170" cy="30" r="16"/><circle class="ring" pathLength="1" cx="170" cy="30" r="16"/>
    <g class="flag"><path d="M161 21h18v18h-18z" fill="#fff"/><path d="M179 21v18h-18z" fill="#f06a2b"/><path d="M161 21h18v18h-18z" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".8"/></g></svg>
   <div class="t">${letters}</div><div class="rule"></div><div class="k">D/H 16–21 · säsongen 2026/27</div></div>`;
  /* every contour draws in, hill by hill, from the middle of the screen outwards */
  const ps=[...r.querySelectorAll(".map path:not(.veg):not(.lake)")];ps.forEach((p,k)=>{p.setAttribute("pathLength","1");p.style.setProperty("--d",(.05+(k/ps.length)*.7).toFixed(3)+"s")});
  r.classList.add("fw");document.body.appendChild(r);document.body.classList.add("reel-hold");reelEnd=performance.now()+3400;
  let gone=false,started=false;
  const go=fast=>{if(gone)return;gone=true;off();reelEnd=performance.now();r.classList.add(fast?"skip":"out");
    document.body.classList.remove("reel-hold");setTimeout(()=>r.remove(),fast?450:900)};

function flip(){

/* square crop and re-encode in the browser: small upload, no EXIF or GPS data */
function cropPhoto(file,max=512){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error("Välj en bildfil."));return}
    if(file.size>25e6){rej(new Error("Filen är för stor."));return}
    const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const n=Math.min(img.naturalWidth,img.naturalHeight);if(n<120){URL.revokeObjectURL(u);rej(new Error("Fotot är för litet. Använd ett som är minst 120 pixlar brett."));return}
      const S=Math.min(max,n),c=document.createElement("canvas");c.width=c.height=S;
      const sx=(img.naturalWidth-n)/2,sy=Math.max(0,(img.naturalHeight-n)*.3);
      c.getContext("2d").drawImage(img,sx,sy,n,n,0,0,S,S);URL.revokeObjectURL(u);
      c.toBlob(b=>b?res({blob:b,url:c.toDataURL("image/jpeg",.6)}):rej(new Error("Kunde inte läsa fotot.")),"image/jpeg",.86)};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Kunde inte läsa fotot."))};img.src=u;
  });
}

function pwDone(){if(!pwOpen&&!pwBusy)return;pwOpen=false;pwBusy=false;pwMsg="";clearTimeout(pwSlow);
  $("#modal").innerHTML=`<div class="modal" data-close="1"><div class="sheet welcome" role="dialog" aria-modal="true" aria-label="Lösenordet är bytt"><svg class="tick" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="40"/><path d="M29 47 l11 11 l23 -25"/></svg><h2>Lösenordet är bytt</h2><p>Du är inloggad. Nästa gång loggar du in med det nya lösenordet.</p><div class="row"><button class="btn on" data-close="1">Klart</button></div></div></div>`}
let pwSlow=0;
async function savePw(){
  if(pwBusy||!cloud.sb)return;const a=($("#pwNew")||{}).value||"",b=($("#pwNew2")||{}).value||"",m=$("#pwMsg");
  const say=t=>{pwMsg=t;const x=$("#pwMsg");if(x)x.textContent=t};
  const idle=()=>{const b2=$("#pwSave");if(b2){b2.disabled=false;b2.textContent="Spara lösenordet"}};
  if(a.length<8)return say("Lösenordet måste vara minst 8 tecken.");
  if(a!==b)return say("Lösenorden är inte likadana.");
  pwBusy=true;say("");const btn=$("#pwSave");if(btn){btn.disabled=true;btn.textContent="Ett ögonblick…"}
  /* never an endless wait: after a while say so and let them try again; a late answer still finishes the job */
  pwSlow=setTimeout(()=>{if(!pwBusy)return;pwBusy=false;idle();say("Det tar längre tid än vanligt. Försök igen, eller ladda om sidan och be om en ny länk.")},12000);
  try{const r=await cloud.sb.auth.updateUser({password:a});
    if(r.error){clearTimeout(pwSlow);pwBusy=false;idle();say(/different from the old/i.test(r.error.message)?"Välj ett annat lösenord än det gamla.":/session|expired|missing/i.test(r.error.message)?"Länken har gått ut. Be om en ny under Logga in.":"Det gick inte att spara. Försök igen.")}
    else{pwBusy=true;pwDone()}
  }catch(e){clearTimeout(pwSlow);pwBusy=false;idle();say("Det gick inte att spara. Försök igen.")}
}
async function sendReset(){
  if(authBusy||!cloud.sb)return;authMsg="";authOk=false;const email=authEmail.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){authMsg="Skriv en riktig e-postadress.";render();return}
  authBusy=true;render();
  try{const r=await cloud.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    /* the same answer whether or not the address has an account, so the form never tells who plays */
    if(r.error&&/rate|too many|seconds/i.test(r.error.message))authMsg="Vänta en stund innan du ber om en ny länk.";
    else{authOk=true;authMsg="Om det finns ett konto med den adressen har vi skickat en länk. Kolla din e-post, även skräpposten."}
  }catch(e){authMsg="Något gick fel. Försök igen."}
  authBusy=false;render();
}
async function doAuth(kind){
  if(kind==="forgot")return sendReset();
  if(authBusy||!cloud.sb)return;authMsg="";authOk=false;
  const email=authEmail.trim(),pw=authPw;
  if(!email||!pw){authMsg="Fyll i din e-post och ett lösenord.";render();return}
  if(kind==="up"&&pw.length<8){authMsg="Lösenordet måste vara minst 8 tecken.";render();return}
  authBusy=true;render();
  try{
    if(kind==="up"){
      const r=await cloud.sb.auth.signUp({email,password:pw,options:{data:{name:(authName||mgrName||"").trim().slice(0,24)},emailRedirectTo:location.origin+location.pathname}});
      if(r.error)authMsg=r.error.message;else if(!r.data.session)authMsg="Kolla din e-post och klicka på bekräftelselänken, logga sedan in.";else{authPw="";if(authName)mgrName=authName.trim().slice(0,24)}
    }else{
      const r=await cloud.sb.auth.signInWithPassword({email,password:pw});
      if(r.error)authMsg=r.error.message==="Invalid login credentials"?"Fel e-post eller lösenord.":r.error.message;else authPw="";
    }
  }catch(e){authMsg="Något gick fel. Försök igen."}
  authBusy=false;render();
}
const mkCode=n=>{const slug=(n.toUpperCase().replace(/[^A-Z0-9ÅÄÖ]+/g,"_").replace(/^_+|_+$/g,"")||"LEAGUE").slice(0,14);const al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let r="";for(let i=0;i<4;i++)r+=al[Math.floor(Math.random()*al.length)];return slug+"-"+r};
async function joinLeague(code,name){
  code=code.trim().toUpperCase();
  if(!cloud.uid){leagueMsg="Logga in först.";return false}
  if(!/^[A-Z0-9ÅÄÖ_]{1,14}-[A-Z0-9]{4}$/.test(code)){leagueMsg="Koden ser inte rätt ut. Den ska se ut som NAMN-1A2B.";return false}
  if(myLeagues.includes(code)){leagueMsg="Du är redan med i den här ligan.";return false}
  if(myLeagues.length>=8){leagueMsg="Du kan vara med i högst 8 ligor.";return false}
  if(name){const r=await cloud.sb.from("leagues").insert({code,name:name.slice(0,40),owner:cloud.uid});if(r.error){leagueMsg="Kunde inte skapa ligan. Försök igen.";return false}}
  const m=await cloud.sb.from("league_members").insert({code,user_id:cloud.uid});
  if(m.error){leagueMsg=m.error.code==="23503"?"Ingen liga har den koden.":"Kunde inte gå med i ligan. Försök igen.";return false}
  if(!name){try{const lg=await cloud.sb.from("leagues").select("name").eq("code",code).maybeSingle();if(lg.data&&lg.data.name)myLgn[code]=String(lg.data.name).slice(0,24)}catch(e){}}
  myLeagues.push(code);if(name){myLgn[code]=name;myOwn[code]=true}watchLeague(code);save();pushCloud();leagueMsg="Du är med i "+lgName(code)+".";return true;
}
document.addEventListener("input",e=>{const t=e.target;if(t.id==="authEmail")authEmail=t.value;if(t.id==="authPw")authPw=t.value;if(t.id==="authName")authName=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&["authEmail","authPw","authName"].includes(e.target.id))doAuth(authMode);if(e.key==="Enter"&&["pwNew","pwNew2"].includes(e.target.id))savePw()});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.id==="authIn"||t.id==="authUp")doAuth(t.id==="authUp"?"up":"in");
  if(t.id==="authSwap"){authMode=authMode==="in"?"up":"in";authMsg="";authOk=false;render()}
  if(t.dataset.weekr!==undefined&&t.dataset.weekr!==""){wmR=+t.dataset.weekr;render();return}
  if(t.id==="authForgot"){authMode="forgot";authMsg="";authOk=false;render();setTimeout(()=>{const x=$("#authEmail");x&&x.focus()},30)}
  if(t.id==="authBack"){authMode="in";authMsg="";authOk=false;render()}
  if(t.id==="authReset")sendReset();
  if(t.id==="pwSave")savePw();
  if(t.id==="pwLater"){pwOpen=false;$("#modal").innerHTML=""}
  if(t.id==="avDel"){delAvatar();return}
  if(t.id==="authOut"){cloud.ready=false;resetLocal();sqStore={};sqMem={};pfCache.clear();try{localStorage.removeItem(SQK)}catch(e){}localUid=null;try{localStorage.removeItem(KEY)}catch(e){}tab="profile";cloud.sb.auth.signOut().then(()=>{leagueRows={};render()})}
});

render();launchTick();initCloud();
if(AUTH_BACK.err){welcomed=true;welcomeSheet("err")}
</script>

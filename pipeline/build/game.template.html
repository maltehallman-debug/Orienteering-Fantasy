<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" id="themeColor">
<meta name="description" content="Fantasy orienteering for D/H 16–21. Pick six runners, boost one, and score on real results from liveresultat.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="O-Fantasy">
<title>Orienteering Fantasy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23059669' stroke-width='5'/%3E%3Cpath d='M22 22h20v20H22z' fill='%23fff'/%3E%3Cpath d='M42 22v20H22z' fill='%23f06a2b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@400;500;600&display=swap">
<script>/* apply the saved theme before first paint, so the page never flashes the wrong colours */
try{var t=localStorage.getItem("of-theme");if(t==="night"||t==="forest")t="dark";if(t==="map")t="light";if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* Orienteering Fantasy. Classic colours: white and slate with one emerald, and a dark mode to match.
   Familjen Grotesk (Stockholm) for words, Martian Mono for the small print, like a timing slip. */
:root{
  --font:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --r:16px; --r-sm:11px; --gutter:clamp(16px,4vw,32px); --tabbar:0px;
}
/* LIGHT: white pages, dark text, one emerald */
:root,[data-theme="light"]{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef1f5;
  --line:rgba(15,23,42,.08); --line-2:rgba(15,23,42,.15);
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --accent:#059669; --accent-press:#047857; --accent-ink:#ffffff; --accent-tint:rgba(5,150,105,.09); --accent-line:rgba(5,150,105,.42);
  --c2:#0d9488; --c3:#65a30d; --contour:#94a3b8;
  --good:#16a34a; --bad:#dc2626; --warn:#d97706;
  --hdr:rgba(255,255,255,.85); --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -16px rgba(15,23,42,.25);
  --contour-op:.35; color-scheme:light;
}
/* DARK: the same, with the lights off */
[data-theme="dark"]{
  --bg:#0b1120; --surface:#111827; --surface-2:#162033; --surface-3:#1f2a3d;
  --line:rgba(226,232,240,.08); --line-2:rgba(226,232,240,.15);
  --text:#f1f5f9; --text-2:#94a3b8; --text-3:#64748b;
  --accent:#34d399; --accent-press:#10b981; --accent-ink:#04261a; --accent-tint:rgba(52,211,153,.12); --accent-line:rgba(52,211,153,.5);
  --c2:#2dd4bf; --c3:#a3e635; --contour:#475569;
  --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --hdr:rgba(11,17,32,.85); --shadow:0 10px 30px -18px rgba(0,0,0,.8);
  --contour-op:.4; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-padding-top:80px;overscroll-behavior-y:none}
body{margin:0;background:transparent;color:var(--text);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;padding-bottom:calc(64px + var(--tabbar));transition:color .3s}
.container{width:100%;max-width:1140px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px));position:relative}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button,[role="button"],.btn,.tag,nav button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:clamp(28px,3.6vw,40px);line-height:1.02;letter-spacing:-.035em;margin:40px 0 14px}
h3{font-size:16.5px;margin:0 0 8px;letter-spacing:-.015em}
p{text-wrap:pretty}
.eyebrow,.next-k,.facts span,th,.stats span,.hl>span:first-child,.kv span{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.num{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sub{color:var(--text-2);font-size:13.5px;overflow-wrap:anywhere}
.note{color:var(--text-2);font-size:14px}
.lead{color:var(--text-2);margin:0 0 16px;max-width:62ch;font-size:16px}
.up,.pos{color:var(--good)} .dn,.neg{color:var(--bad)} .pos,.neg{font-weight:700}

/* ---------- the map behind everything ---------- */
.terrain{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg);transition:background-color .4s}
.terrain svg{position:absolute;left:-10%;top:-10%;width:120%;height:120%;opacity:var(--contour-op);transition:opacity .4s}
.terrain path{fill:none;stroke:var(--contour);stroke-width:1;vector-effect:non-scaling-stroke}
.terrain path.ix{stroke-width:2}
.terrain .veg{fill:var(--contour);opacity:.05;stroke:none}
.terrain .lake{fill:var(--c2);opacity:.06;stroke:none}
@media (prefers-reduced-motion:no-preference){
  .terrain svg{animation:drift 140s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(-4%,3%,0) rotate(2.5deg)}}
}

/* ---------- header ---------- */
.nav{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:var(--hdr);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:inline-flex;align-items:center;gap:11px;white-space:nowrap;background:none;border:0;padding:0;color:var(--text)}
.logo svg{flex:none;display:block;overflow:visible}
.logo b{font:700 19px/1 var(--font);letter-spacing:-.03em}
.logo b span{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .logo .flag{transform-origin:14px 14px;transition:transform .5s var(--spring)}
  @media (hover:hover) and (pointer:fine){.logo:hover .flag{transform:rotate(-8deg) scale(1.08)}}
  .logo .ring{transform-origin:14px 14px;animation:ringIn 1s var(--ease-out) both}
  @keyframes ringIn{from{transform:scale(.4);opacity:0}}
}
nav.tabs{display:flex;gap:2px;position:relative}
nav.tabs button{position:relative;background:none;border:0;padding:9px 13px;border-radius:10px;color:var(--text-2);font-size:15px;font-weight:600;white-space:nowrap;transition:color .2s}
nav.tabs button[aria-selected="true"]{color:var(--text)}
nav.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:2.5px;border-radius:2px;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){nav.tabs button[aria-selected="true"]::after{animation:under .35s var(--ease-out)}@keyframes under{from{transform:scaleX(.2);opacity:0}}}
nav.tabs svg{display:none}
.tabbar{display:none}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
#themeBtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);display:grid;place-items:center;padding:0;color:var(--text);transition:transform .15s var(--ease-out)}
#themeBtn:active{transform:scale(.92)}
#themeBtn svg{width:19px;height:19px}
@media (prefers-reduced-motion:no-preference){#themeBtn svg{transition:transform .6s var(--spring)}#themeBtn:active svg{transform:rotate(-40deg)}}
#mgr{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:0;border-radius:999px;padding:5px 13px 5px 5px;font-size:14px;font-weight:600;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .12s var(--ease-out)}
#mgr:active{transform:scale(.96)}
#mgr .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--font);background:var(--accent);color:var(--accent-ink)}
#mgr.out{padding:9px 16px;background:var(--accent);color:var(--accent-ink);box-shadow:none}
#mgr .badge{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font:700 11px/19px var(--font);text-align:center}
@media (hover:hover) and (pointer:fine){nav.tabs button:hover{color:var(--text)}}
@media (max-width:760px){
  :root{--tabbar:calc(60px + env(safe-area-inset-bottom,0px))}
  .nav-inner{height:56px;gap:12px}
  .logo b{font-size:17px}
  .nav nav.tabs{display:none}
  /* outside the header: the header's backdrop-filter would otherwise become the fixed bar's containing block */
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:var(--hdr);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line)}
  .tabbar button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;border-radius:12px;color:var(--text-3);background:none;border:0;transition:color .2s}
  .tabbar button[aria-selected="true"]{color:var(--text)}
  .tabbar svg{display:block;width:24px;height:24px;transition:transform .3s var(--spring)}
  .tabbar button[aria-selected="true"] svg{color:var(--accent);transform:translateY(-2px) scale(1.08)}
  #mgr .nm{max-width:8ch;overflow:hidden;text-overflow:ellipsis}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;line-height:1;border-radius:var(--r-sm);padding:12px 17px;border:0;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line-2);transition:transform .12s var(--ease-out),background-color .2s,color .2s,box-shadow .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:default}
.btn.on,.btn.light{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.go{width:100%;padding:16px 20px;font-size:16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 26px -14px var(--accent)}
.btn.go:disabled{background:var(--surface-3);color:var(--text-3);box-shadow:none;opacity:1}
.btn.quiet{background:none;box-shadow:none;color:var(--text-2);padding:8px 4px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--text-3)}
  .btn.on:hover:not(:disabled),.btn.go:hover:not(:disabled),.btn.light:hover:not(:disabled){background:var(--accent-press);box-shadow:none}
  .btn.go:hover:not(:disabled){transform:translateY(-1px)}
  .btn.quiet:hover:not(:disabled){box-shadow:none;color:var(--text)}
}

/* ---------- page head ---------- */
main#view{padding-top:20px}
.next{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:26px 0 20px;margin-bottom:18px}
.next::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 22px);opacity:.55}
.next-main{display:grid;gap:6px;min-width:0}
.next-k{color:var(--accent)}
.next-main b{font-size:clamp(34px,5.4vw,58px);line-height:.95;letter-spacing:-.045em;font-weight:700}
.next-side{text-align:right;display:grid;gap:2px}
.next-side .num{font-size:40px;line-height:1}
.livestrip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);margin:0 0 16px}
.livestrip b{font-size:30px;letter-spacing:-.04em}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 8px}
.facts:empty{display:none}
.facts>div{background:var(--surface);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);position:relative;overflow:hidden}
.facts>div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fc,var(--accent))}
.facts>div:nth-child(2){--fc:var(--c2)}.facts>div:nth-child(3){--fc:var(--c3)}.facts>div:nth-child(4){--fc:var(--contour)}
.facts b{display:block;margin-top:6px;font-size:30px;line-height:1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.facts b{font-size:25px}}
.course{margin:8px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.course:empty{display:none}
.course svg{display:block;min-width:700px;width:100%;height:auto}
.course .leg{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round}
.course .leg.todo{stroke-opacity:.35;stroke-dasharray:1 7}
.course .ctl{cursor:pointer;transform-box:fill-box;transform-origin:center}
.course .ctl circle{fill:var(--bg);stroke:var(--accent);stroke-width:2.2;transition:transform .3s var(--spring);transform-box:fill-box;transform-origin:center}
.course .ctl.done circle{fill:var(--accent)}
.course .ctl.now circle{stroke-width:3.4}
.course .ctl text{font:600 12px var(--mono);fill:var(--accent);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.course .ctl.done text{fill:var(--accent-ink)}
.course .ctl .pts{font:500 10.5px var(--mono);fill:var(--text-3)}
.course .ctl.done .pts{fill:var(--text);font-weight:600}
.course .ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.course .fin,.course .sta{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
@media (hover:hover) and (pointer:fine){.course .ctl:hover circle{transform:scale(1.15)}}
@media (prefers-reduced-motion:no-preference){
  .course .leg.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s var(--ease-out) forwards;animation-delay:calc(var(--k,0) * 90ms)}
  .course .ctl.now .ring{animation:ping 2.2s ease-out infinite}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
}

/* ---------- layout ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);padding:18px 20px;margin-bottom:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid2 .card{margin-bottom:0}
.grid2+.grid2,.grid2+.card,.card+.grid2{margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);padding:18px;display:grid;gap:16px}
@media (max-width:900px){.side{position:static}}
.side dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:15px}
.side dt{color:var(--text-2)}.side dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .btn{padding:10px 13px;font-size:14px}
.errs{margin:0;padding-left:18px;color:var(--bad);font-size:14px}
.fixtures{display:grid}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
.fixtures .tag{display:flex;justify-content:space-between;gap:10px;background:none;box-shadow:none;border-radius:0;padding:9px 0;border-top:1px dashed var(--line-2);font-size:14px}
.fixtures .tag:first-child{border-top:0;padding-top:0}
.tag.w{color:var(--accent);font-weight:700}

/* ---------- squad ---------- */
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;position:relative}
@media (max-width:520px){.squad{grid-template-columns:1fr 1fr;gap:8px}}
.rc{position:relative;border-radius:var(--r);padding:14px;min-width:0;display:grid;gap:10px;align-content:start;background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);transition:transform .25s var(--ease-out),box-shadow .25s}
@media (hover:hover) and (pointer:fine){.rc:not(.slot):hover{transform:translateY(-3px)}}
.rc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rc .who{font-size:16px;line-height:1.2}
.rc .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc .cls{font:600 10.5px/1 var(--mono);padding:5px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-2)}
.rc .price{font-size:21px;font-weight:700;letter-spacing:-.04em;text-align:right;line-height:1}
.rc .price small{display:block;margin-top:3px;font:500 10px var(--mono);letter-spacing:0}
.rc .rm{width:30px;height:30px;border-radius:9px;border:0;background:none;color:var(--text-3);font-size:19px;line-height:1;display:grid;place-items:center;padding:0;transition:background-color .15s,color .15s,transform .12s}
.rc .rm:active{transform:scale(.9)}
@media (hover:hover) and (pointer:fine){.rc .rm:hover{background:var(--surface-3);color:var(--bad)}}
.rc.slot{place-items:center;min-height:210px;text-align:center;color:var(--text-3);background:none;box-shadow:none;border:2px dashed var(--line-2);font-size:14px}
.rc.slot b{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 8px;border-radius:50%;border:2.5px solid var(--accent);color:var(--accent);font-size:26px;font-weight:600;opacity:.55}
.rc.boosted{box-shadow:var(--shadow),inset 0 0 0 2px var(--accent)}
.rc.boosted .av{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--accent)}
.mult{position:absolute;top:10px;right:46px;font:700 13px/1 var(--mono);padding:6px 8px;border-radius:8px;background:var(--accent);color:var(--accent-ink);transform:rotate(-6deg)}
.rc .gl{display:none}
.boost{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;border:0;border-radius:var(--r-sm);padding:10px 12px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--text-2);box-shadow:inset 0 0 0 1.5px var(--line-2);transition:transform .12s var(--ease-out),background-color .2s,color .2s}
.boost svg{width:15px;height:15px;flex:none}
.boost:active:not(:disabled){transform:scale(.95)}
.boost.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.boost:disabled{cursor:default}
.boost:disabled:not(.on){opacity:.5}
@media (hover:hover) and (pointer:fine){.boost:not(.on):not(:disabled):hover{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent-line)}}
.spark{display:block}.spark rect{fill:var(--c2)}.spark rect.z{fill:var(--line-2)}.spark line{stroke:var(--line)}
/* the stamp when a squad is locked */
.stamp{position:absolute;z-index:3;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-8deg);pointer-events:none;font:700 clamp(30px,6vw,54px)/1 var(--font);letter-spacing:.04em;color:var(--accent);border:5px solid var(--accent);border-radius:14px;padding:8px 22px;background:color-mix(in srgb,var(--surface) 70%,transparent);mix-blend-mode:normal}
@media (prefers-reduced-motion:no-preference){
  .rc.pop{animation:popIn .55s var(--spring) both}
  @keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
  .rc.zap .av{animation:punch .5s var(--spring)}
  .rc.zap .mult{animation:multIn .45s var(--spring)}
  @keyframes punch{0%{transform:scale(1)}35%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}
  @keyframes multIn{from{transform:rotate(-30deg) scale(.3);opacity:0}}
  .stamp{animation:stampIn .5s var(--spring) both,stampOut .4s ease-in 1.5s forwards}
  @keyframes stampIn{from{transform:translate(-50%,-50%) rotate(-24deg) scale(2.2);opacity:0}}

  const t=[["team","Team"],["rounds","Rounds"],["leagues","Leagues"],["rules","Rules"],["profile","Profile"]],I={team:'<path d="M4 20c0-3.3 3.6-5 8-5s8 1.7 8 5"/><circle cx="12" cy="8" r="4"/>',rounds:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',leagues:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 6h3v1a3 3 0 0 1-3 3M7 6H4v1a3 3 0 0 0 3 3"/>',rules:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',profile:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.2-2 3.2-3 5.5-3s4.3 1 5.5 3"/>'};
  const html=t.map(([k,l])=>`<button aria-current="${tab===k?"page":"false"}" aria-selected="${tab===k}" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>${l}</button>`).join("");

function renderFacts(){
  if(tab!=="team"||done()){$("#facts").innerHTML="";return}
  const r=R(),bank=done()?state.bank:E.bankAfter(state,plan.squad);
  const where=done()?"Season complete":"Round "+D.rounds[r].n+": "+dshort(D.rounds[r].start)+" to "+dshort(D.rounds[r].end);
  const sv=plan.squad.reduce((a,i)=>a+E.price(i,pr()),0);
  $("#facts").innerHTML=`<div><span>Points</span><b data-count="${state.total/10}" data-key="pts">${fp(state.total)}</b></div>
   <div><span>In the bank</span><b class="${bank<0?"dn":""}" data-count="${bank/10}" data-key="bank" data-suf="M">${fp(bank)}M</b></div>
   <div><span>Squad value</span><b ${plan.squad.length?`data-count="${sv/10}" data-key="val" data-suf="M"`:""}>${plan.squad.length?fp(sv)+"M":"–"}</b></div>
   <div><span>Chips left</span><b>${(state.chips.wc?0:1)+(state.chips.tc?0:1)} of 2</b></div>`;

/* ---------- team ---------- */
function spark(i,r){
  const h=E.visible(i,r).slice(-6).map(x=>x.pts);if(!h.length)return `<span class="note">no results</span>`;
  const w=60,ht=24,bw=w/6;
  return `<svg class="spark" width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><line x1="0" x2="${w}" y1="${ht-.5}" y2="${ht-.5}"/>${h.map((p,k)=>{const v=Math.max(0,Math.min(1,p/300)),bh=Math.max(1.5,v*(ht-3));return `<rect ${p<=0?'class="z" ':""}x="${(k+(6-h.length))*bw+1}" y="${ht-1-bh}" width="${bw-2}" height="${bh}" rx="1"/>`}).join("")}</svg>`;
}
function squadCard(i,k,show,locked){
  const r=pr(),s=E.stats(i,r),d=r>0?E.price(i,r)-E.price(i,r-1):0,on=show.captain===i,m=show.chip==="tc"?3:2;
  return `<div class="rc ${on?"boosted":""} ${justAdded===i?"pop":""} ${justBoosted===i?"zap":""}" style="--i:${k}" data-card="${i}">
   ${on?`<span class="mult">${m}x</span>`:""}<span class="gl"></span>
   <div class="top">${avatar(i)}${locked?"":`<button class="rm" data-sell="${i}" title="Remove from squad" aria-label="Remove ${esc(nameOf(i))}">&times;</button>`}</div>
   <div style="min-width:0"><button class="who" data-prof="${i}">${esc(nameOf(i))}</button><div class="sub">${esc(clubOf(i))}</div></div>
   <div class="meta"><span class="cls">${D.runners[i].k}</span>${spark(i,r)}</div>
   <div class="meta"><span class="sub">${s.starts} starts, form ${fp(s.form)}</span><span class="price">${fp(E.price(i,r))}M<small class="${d>0?"up":d<0?"dn":""}">${d?(d>0?"+":"-")+fp(Math.abs(d)):"same"}</small></span></div>
   <button class="boost ${on?"on":""}" data-boost="${i}" ${locked?"disabled":""} aria-pressed="${on}" aria-label="${on?esc(nameOf(i))+" is boosted":"Boost "+esc(nameOf(i))}">${BOLT}${on?"Boosted "+m+"x":"Boost"}</button></div>`;
}
function canAddReason(i){
  if(plan.squad.length>=D.squad)return "Squad is full";
  if(clubCount(plan.squad,i)>=D.clubMax)return "Max "+D.clubMax+" from one club";
  if(E.bankAfter(state,[...plan.squad,i])<0)return "Not enough budget";
  return "";
}
function marketRows(){
  const r=pr();let rows=[];
  for(let i=0;i<E.N;i++){if(!D.runners[i].p)continue;
    if(q&&!(nameOf(i)+" "+clubOf(i)).toLowerCase().includes(q))continue;
    if(clubF&&clubOf(i)!==clubF)continue;
    if(clsF&&(clsF.length===1?D.runners[i].k[0]!==clsF:D.runners[i].k!==clsF))continue;
    const s=E.stats(i,r),p=E.price(i,r);
    if(afford&&!plan.squad.includes(i)&&E.bankAfter(state,[...plan.squad,i])<0)continue;
    rows.push({i,s,p,d:r>0?p-E.price(i,r-1):0,n:nameOf(i),avg:s.starts?s.total/s.starts:0});
  }
  const v={price:x=>x.p,form:x=>x.s.form,total:x=>x.s.total,avg:x=>x.avg,starts:x=>x.s.starts,name:x=>x.n.toLowerCase()}[sortKey];
  rows.sort((a,b)=>{const x=v(a),y=v(b);return (x<y?-1:x>y?1:0)*sortDir||a.i-b.i});
  return rows;
}
function marketHtml(){
  const rows=marketRows();const clubs=[...new Set(D.runners.filter(x=>x.p).map(x=>x.c))].sort((a,b)=>a.localeCompare(b,"sv"));
  const th=(k,l)=>`<th><button data-sort="${k}">${l}${sortKey===k?(sortDir<0?" ↓":" ↑"):""}</button></th>`;
  return `<h2 id="market">Runners</h2>
  <div class="filters"><input type="search" id="q" placeholder="Search runner or club" value="${esc(q)}" aria-label="Search runners">
   <select id="clsF" aria-label="Class"><option value="">All classes</option>${["H","D","H16","H18","H20","H21","D16","D18","D20","D21"].map(c=>`<option value="${c}" ${c===clsF?"selected":""}>${c==="H"?"All men (H)":c==="D"?"All women (D)":c}</option>`).join("")}</select>
   <select id="clubF" aria-label="Club"><option value="">All clubs</option>${clubs.map(c=>`<option ${c===clubF?"selected":""}>${esc(c)}</option>`).join("")}</select>
   <label><input type="checkbox" id="afford" ${afford?"checked":""}> Affordable only</label></div>
  <div class="tbl"><table><thead><tr>${th("name","Runner")}${th("price","Price")}<th>Change</th>${th("form","Form")}<th>Last six</th>${th("avg","Per start")}${th("total","Points")}${th("starts","Starts")}<th></th></tr></thead><tbody>
  ${rows.slice(0,shown).map(x=>{const inS=plan.squad.includes(x.i),why=inS?"":canAddReason(x.i);
   return `<tr class="${inS?"in":""} ${justAdded===x.i?"pop":""}"><td><div class="who-wrap">${avatar(x.i,"sm")}<div><button class="who" data-prof="${x.i}">${esc(x.n)}</button><div class="sub">${D.runners[x.i].k}, ${esc(clubOf(x.i))}</div></div></div></td><td><b>${fp(x.p)}M</b></td><td class="${x.d>0?"up":x.d<0?"dn":""}">${x.d?(x.d>0?"+":"-")+fp(Math.abs(x.d)):"–"}</td><td>${fp(x.s.form)}</td><td>${spark(x.i,pr())}</td><td>${x.s.starts?fp(x.avg):"–"}</td><td>${fp(x.s.total)}</td><td>${x.s.starts}</td>
   <td>${inS?`<button class="btn" data-sell="${x.i}">Remove</button>`:`<button class="btn" data-add="${x.i}" ${why?"disabled":""} title="${esc(why)}">Add</button>`}</td></tr>`}).join("")||`<tr><td colspan="9" class="note">No runners match. Clear the search or club filter.</td></tr>`}
  </tbody></table></div>
  ${rows.length>shown?`<p><button class="btn" id="more">Show ${Math.min(40,rows.length-shown)} more</button></p>`:""}
  <p class="note">Form is the average of the last three results. Prices and stats only count races before this round.</p>`;
}
/* one entry per competition: results are stored per class ("Name (H16)") and some organisers publish a race twice */
const compName=n=>n.replace(/ \([DH]\d+[A-Z]*\)$/,"").replace(/\s*\((lokal kopia|local copy)[^)]*\)?\s*$/i,"").trim();
function comps(r){
  const m=new Map(),add=(name,date,tier)=>{const n=compName(name),k=n.toLowerCase()+"|"+date;const o=m.get(k);if(!o)m.set(k,{n,date,tier});else o.tier=Math.max(o.tier,tier)};
  D.rounds[r].ev.forEach(ei=>{const e=D.events[ei];add(e.name,e.date,e.tier)});
  sched(r).forEach(u=>add(u.name,u.date,1));
  return [...m.values()].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.n.localeCompare(b.n,"sv"));
}
function raceTags(r){
  const c=comps(r);
  return c.length?c.slice(0,8).map(x=>`<span class="tag ${x.tier>1?"w":""}"><span>${esc(x.n)}${x.tier>1?" · ×"+x.tier:""}</span><span class="sub" style="white-space:nowrap">${dshort(x.date)}</span></span>`).join("")+(c.length>8?`<span class="note">and ${c.length-8} more</span>`:""):`<span class="note">No races listed yet. They show up on liveresultat a few days before.</span>`;
}
function liveNow(){
  if(!isLive())return "";const L=state.log[state.log.length-1];
  if(!L||isFinal(L.round))return "";
  return `<div class="livestrip"><div><span class="livedot">Live</span> <span class="note">Round ${D.rounds[L.round].n}${L.carried?", last round's squad is playing":""}</span><div style="margin-top:6px"><b>${fp(L.total)}</b> <span class="note">points so far</span></div></div><button class="btn" data-tab="rounds">Your runners</button></div>`;
}
function hero(r){
  const rd=D.rounds[r],d=daysTo(rd.start),u=comps(r),first=u[0];
  const title=first?esc(first.n.replace(/:.*/,"").replace(/,.*/,"")):"Week of "+dshort(rd.start);
  const when=dshort(rd.start)+" – "+dshort(rd.end);
  const side=isFinal(r)?`<span class="eyebrow">Scored</span>`:hasStarted(r)?`<span class="livedot">Live</span>`:
    `<span class="eyebrow">Locks ${d===1?"tomorrow":"in"}</span>${d===1?"":`<span class="num">${d} days</span>`}<span class="sub">Monday ${dshort(rd.start)}</span>`;
  return `<div class="next"><div class="next-main"><span class="next-k">Round ${rd.n} · ${when}</span><b>${title}</b>${u.length>1?`<span class="sub">and ${u.length-1} more race${u.length===2?"":"s"} this week</span>`:""}</div><div class="next-side">${side}</div></div>`;
}
function teamView(){
  if(done())return `<div class="card"><h2 style="margin-top:0">Season complete</h2><p>You finished on <b>${fp(state.total)}</b> points.</p><button class="btn on" data-tab="profile">See your season</button></div>`;
  const r=R(),rd=D.rounds[r],locked=lock&&lock.round===r,frozen=locked&&hasStarted(r);
  const show=locked?lock:plan;
  const errs=plan.squad.length?E.planErrors(state,{...plan,chip:plan.chip}):["Pick "+D.squad+" runners to start"];
  const t=E.transfersFor(state,plan.squad),pen=plan.chip==="wc"?0:(!state.squad.length?0:Math.max(0,t.n-D.freeTransfers)*D.penalty);
  const rows=[];for(let k=0;k<D.squad;k++)rows.push(show.squad[k]!==undefined?squadCard(show.squad[k],k,show,locked):`<div class="rc slot" style="--i:${k}"><div><b>${k+1}</b>Empty control</div></div>`);
  const fin=isFinal(r);
  const lead=locked?(frozen?"Locked. Points come in as the results do.":"Locked for round "+rd.n+". You can unlock and change it until Monday."):
     (!state.squad.length?"Pick six runners within "+fp(D.budget)+"M, at most "+D.clubMax+" from one club. Changes are free until you lock.":D.freeTransfers+" free transfers this round. Prices follow the latest results.");
  return `${hero(r)}${liveNow()}<div class="two"><div>
   <h2 style="margin-top:0">Your squad${locked?` <span class="host" style="font-family:var(--font)">Locked</span>`:""}</h2>
   <p class="lead">${lead}</p>
   <div class="squad">${rows.join("")}${justLocked&&locked?'<div class="stamp" aria-hidden="true">LOCKED</div>':""}</div>
   <p class="note" style="margin-top:10px">Your boosted runner scores double, or triple with the 3x Boost chip. No race, no boost.</p>
  </div>
  <aside class="side">
   <div><span class="eyebrow">Races this round</span><div class="fixtures" style="margin-top:10px">${raceTags(r)}</div></div>
   <dl><dt>Transfers</dt><dd>${!state.squad.length?"free":t.n+" of "+D.freeTransfers+" free"}</dd><dt>Penalty</dt><dd class="${pen?"dn":""}">${pen?"-"+fp(pen):"none"}</dd><dt>Bank after</dt><dd class="${E.bankAfter(state,plan.squad)<0?"dn":""}">${fp(E.bankAfter(state,plan.squad))}M</dd></dl>
   <div><span class="eyebrow">Chip</span><div class="chips" style="margin-top:10px">
    <button class="btn ${!plan.chip?"on":""}" data-chip="" ${locked?"disabled":""}>None</button>
    <button class="btn ${plan.chip==="wc"?"on":""}" data-chip="wc" ${locked||state.chips.wc||!state.squad.length?"disabled":""} title="Unlimited free transfers this round">Wildcard</button>
    <button class="btn ${plan.chip==="tc"?"on":""}" data-chip="tc" ${locked||state.chips.tc?"disabled":""} title="Your boosted runner scores triple">3x Boost</button></div></div>
   ${errs.length&&!locked?`<ul class="errs">${errs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   ${locked?`<button class="btn go" id="unlock" ${frozen?"disabled":""}>${frozen?"Locked until results arrive":"Unlock and edit squad"}</button>`
     :`<button class="btn go" id="play" ${errs.length||hasStarted(r)&&!fin?"disabled":""}>${fin?"Play round "+rd.n:"Lock in squad for round "+rd.n}</button>`}
   ${!locked&&hasStarted(r)&&!fin?`<p class="note" style="margin:0">This round has started and its results are not in yet. Squads for it are closed.</p>`:""}
   ${isLive()&&!locked&&state.squad.length?`<p class="note" style="margin:0">Not locked. If you don't lock before Monday ${dshort(rd.start)}, last round's squad plays again.</p>`:""}
   ${isLive()&&syncMsg?`<p class="note" style="margin:0;color:var(--warn)">${esc(syncMsg)}</p>`:""}
   ${fin&&state.squad.length&&!errs.length?`<button class="btn quiet" id="auto">${confirmAuto?"Confirm: play all finished rounds":"Auto-play finished rounds with this squad"}</button>`:""}
  </aside></div>
  ${locked?"":marketHtml()}`;
}

/* ---------- rounds ---------- */
function evLines(i,rd){
  return E.hist[i].filter(h=>D.rounds[rd].ev.includes(h.ev)).map(h=>{const e=D.events[h.ev];
    const row=D.res[h.ev].find(x=>x[0]===i);const topb=row?row[6]:0;
    return `<div class="ev"><span>${esc(e.name)} <span class="sub">${dshort(e.date)}</span></span><span>${h.kind?`<span class="neg">${["","Did not finish","Mispunch","Disqualified"][h.kind]}</span>`:`place ${h.rank} of ${e.n}, ${(h.gap/100).toFixed(1)}% behind${topb?", beat "+topb+" top "+(topb===1?"runner":"runners"):""}`}, <span class="${h.pts<0?"neg":"pos"}">${sg(h.pts)}</span></span></div>`}).join("")||`<div class="ev sub">Did not race this round</div>`;
}
function roundsView(){
  if(!state.log.length)return `<div class="card">No rounds played yet. ${lock?"Your squad is locked for round "+D.rounds[lock.round].n+". Points appear here when the results are in.":"Lock in your squad on the Team tab."}</div>`;
  const li=Math.min(viewRound,state.log.length-1),L=state.log[li],rd=L.round;
  return `${!isFinal(rd)?`<p class="next-k" style="margin:0 0 6px">Live · points so far, more results may come in</p>`:""}${L.carried?`<p class="note" style="margin:0 0 6px">No squad was locked for this round, so the squad from the round before played.</p>`:""}<div class="rhead"><div><div class="score" data-count="${L.total/10}" data-key="score${li}">${fp(L.total)}</div><div class="note">Round ${D.rounds[rd].n}, ${dshort(D.rounds[rd].start)} to ${dshort(D.rounds[rd].end)}. ${fp(L.base)} from runners${L.capLive===null?", boosted runner did not race":", "+sg(L.capExtra)+" boost from "+esc(nameOf(L.capLive))+(L.chip==="tc"?" (3x)":" (2x)")}${L.penalty?", -"+fp(L.penalty)+" for "+L.transfers+" transfers":""}${L.chip==="wc"?", Wildcard played":""}</div></div>
   <div class="pn"><button class="btn" data-round="${li-1}" ${li===0?"disabled":""}>Previous</button><button class="btn" data-round="${li+1}" ${li>=state.log.length-1?"disabled":""}>Next</button></div></div>
  <div class="grid2">${L.squad.map((i,k)=>{const p=E.pts[rd][i],b=L.captain===i;return `<div class="card" style="--i:${k}${b?";box-shadow:0 0 0 1px var(--accent-line) inset":""}"><div class="ev" style="border:0;padding:0 0 4px;align-items:center"><div style="display:flex;gap:12px;align-items:center;min-width:0">${avatar(i,"sm")}<div style="min-width:0"><button class="who" data-prof="${i}">${esc(nameOf(i))}</button> <span class="sub">${esc(clubOf(i))}${b?`, <b style="color:var(--accent)">boosted ${L.chip==="tc"?"3x":"2x"}</b>`:""}</span></div></div><span class="pts-big ${p<0?"neg":""}">${sg(p)}</span></div>${evLines(i,rd)}</div>`}).join("")}</div>
  <div class="card"><h3>Best scores this round</h3>${E.roundBest(rd,5).map(([i,p],k)=>`<div class="ev"><span>${k+1}. <button class="who" style="font-size:15px" data-prof="${i}">${esc(nameOf(i))}</button> <span class="sub">${esc(clubOf(i))}</span></span><b class="pos">${sg(p)}</b></div>`).join("")||'<div class="sub">No counted races this round.</div>'}</div>
  ${!done()&&li===state.log.length-1?`<p><button class="btn on" data-tab="team" id="next">Plan round ${D.rounds[R()].n}</button></p>`:""}`;
}

  </div>

function seasonBars(){
  const L=state.log,mx=Math.max(100,...L.map(l=>l.total));

}
function themeCard(){

/* ---------- season ---------- */
function chartSvg(){
  const v=state.log.map(l=>l.total/10),nb=Math.max(8,v.length),W=Math.max(560,nb*44),H=170,pad=34,mx=Math.max(50,...v)*1.1,bw=(W-pad)/nb;
  return `<div class="tbl bars" style="padding:10px"><svg viewBox="0 0 ${W} ${H+22}" role="img" aria-label="Points in each round">
   ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${W}" y1="${H-f*(H-10)}" y2="${H-f*(H-10)}"/><text x="0" y="${H-f*(H-10)+4}">${Math.round(f*mx)}</text>`).join("")}
   ${v.map((x,k)=>{const h=Math.max(1,x/mx*(H-10));return `<rect x="${pad+k*bw+5}" y="${H-h}" width="${bw-10}" height="${h}" rx="2"/><text x="${pad+k*bw+bw/2}" y="${H+15}" text-anchor="middle">${D.rounds[state.log[k].round].n}</text>`}).join("")}</svg></div>`;
}
function seasonView(){
  const live=isLive();
  return `<h2 style="margin-top:0">Points per round</h2>

   <p class="note" style="margin:0 0 10px">${live?"You are playing the live season, which starts on "+dshort(D.rounds[LIVE].start)+" with real upcoming races.":"You are replaying past rounds from "+dshort(D.rounds[0].start)+" as practice. Practice rounds do not count in leagues."}</p>

   ${live?`<p class="note" style="margin:10px 0 0">Your live squads stay saved while you practise.</p>`:`<button class="btn quiet" id="reset">${confirmReset?"Confirm: erase this replay and restart":"Restart"}</button>`}</div>`;

function lgName(code){return myLgn[code]||code.replace(/-[A-Z0-9]{4}$/,"").replace(/_/g," ")}
/* open a sheet, or swap its content in place when the same sheet is already open (no replayed animation) */
function showSheet(key,label,inner,wide){
  const cur=document.querySelector("#modal .sheet");
  if(cur&&cur.dataset.key===key){cur.innerHTML=inner;return}
  $("#modal").innerHTML=`<div class="modal" data-close="1"><div class="sheet" data-key="${esc(key)}" role="dialog" aria-modal="true" aria-label="${esc(label)}"${wide?' style="max-width:820px"':""}>${inner}</div></div>`;
  /* measured from layout (offsets), not getBoundingClientRect: the zoom animation has already scaled the sheet */
  const md=document.querySelector("#modal .modal"),sh=md&&md.querySelector(".sheet");
  if(sh){const m=md.getBoundingClientRect();sh.style.transformOrigin=`${(lastPX-m.left-sh.offsetLeft).toFixed(0)}px ${(lastPY-m.top-sh.offsetTop+md.scrollTop).toFixed(0)}px`}
}
/* ===== leagues: table, rounds, every manager's team ===== */
let lgOpen=null,lgSub="table",lgRound=null;
const startedRounds=()=>{const o=openRound(),a=[];for(let r=LIVE;r<Math.min(o,E.R);r++)a.push(r);return a};
const mgrHue=id=>hsh(String(id))%360;
const mgrDot=(m,big)=>`<span class="mdot${big?" big":""}" style="--h:${mgrHue(m.id)}" aria-hidden="true">${esc((m.name||"M").slice(0,1).toUpperCase())}</span>`;
const ptsOf=(m,r)=>m.by[r]?m.by[r].total:null;
function standings(code){
  const rows=(leagueRows[code]||[]).slice(),rs=startedRounds(),cur=rs[rs.length-1],prev=rs[rs.length-2];
  const tot=(m,upto)=>rs.filter(r=>r<=upto).reduce((a,r)=>a+(ptsOf(m,r)||0),0);
  rows.forEach(m=>{m.t=cur===undefined?0:tot(m,cur);m.tp=prev===undefined?0:tot(m,prev)});
  const rank=(arr,k)=>{const s=arr.slice().sort((a,b)=>b[k]-a[k]||a.name.localeCompare(b.name,"sv"));const out={};s.forEach((m,i)=>{out[m.id]=i>0&&s[i-1][k]===m[k]?out[s[i-1].id]:i+1});return out};
  const now=rank(rows,"t"),before=rank(rows,"tp");
  rows.forEach(m=>{m.rank=now[m.id];m.move=prev===undefined?0:before[m.id]-now[m.id]});
  rows.sort((a,b)=>a.rank-b.rank||a.name.localeCompare(b.name,"sv"));
  return {rows,rs,cur,prev};
}
function leagueTable(code){
  const st=standings(code),{rows,cur,prev}=st;
  if(!rows.length)return `<p class="note">Loading members…</p>`;
  if(cur===undefined)return `<p class="note" style="margin:6px 0 10px">The live season starts on Monday ${dshort(D.rounds[LIVE].start)}. Teams and points show here once round ${D.rounds[LIVE].n} has started.</p>
   <div class="lgmembers">${rows.map(m=>`<span class="tag">${mgrDot(m)} ${esc(m.name)}${m.id===cloud.uid?" (you)":""}</span>`).join("")}</div>`;
  const live=!isFinal(cur);
  return `<div class="tbl lgt"><table><thead><tr><th>#</th><th>Manager</th><th>R${D.rounds[cur].n}${live?' <span class="livedot">live</span>':""}</th>${prev!==undefined?`<th class="prevcol">R${D.rounds[prev].n}</th>`:""}<th>Total</th></tr></thead><tbody>
   ${rows.map(m=>`<tr class="${m.id===cloud.uid?"in":""}" data-mgr="${esc(code)}|${esc(m.id)}" tabindex="0"><td><b>${m.rank}</b> ${m.move>0?`<span class="mv up">▲${m.move}</span>`:m.move<0?`<span class="mv dn">▼${-m.move}</span>`:`<span class="mv">–</span>`}</td>
    <td><div class="who-wrap">${mgrDot(m)}<div><b>${esc(m.name)}</b>${m.id===cloud.uid?' <span class="sub">(you)</span>':""}<div class="sub">${chipTags(m)}</div></div></div></td>
    <td>${ptsOf(m,cur)!==null?fp(ptsOf(m,cur)):"–"}</td>${prev!==undefined?`<td class="prevcol">${ptsOf(m,prev)!==null?fp(ptsOf(m,prev)):"–"}</td>`:""}<td><b>${fp(m.t)}</b></td></tr>`).join("")}
   </tbody></table></div>`;
}
function chipTags(m){const c=m.sim.state.chips,b=[];if(c.tc)b.push("3x Boost used");if(c.wc)b.push("Wildcard used");return b.join(", ")||"Both chips left"}
function lgStats(code,r){
  const rows=(leagueRows[code]||[]).filter(m=>m.by[r]),own=new Map(),boost=new Map();
  rows.forEach(m=>{m.by[r].squad.forEach(i=>own.set(i,(own.get(i)||0)+1));const c=m.by[r].captain;boost.set(c,(boost.get(c)||0)+1)});
  const pick=[...own.entries()].map(([i,n])=>({i,n,p:E.pts[r][i],started:E.starts[r][i]>0})).sort((a,b)=>b.n-a.n||b.p-a.p);
  const best=rows.slice().sort((a,b)=>b.by[r].total-a.by[r].total)[0];
  const topRunner=pick.slice().sort((a,b)=>b.p-a.p)[0];
  const diff=pick.filter(x=>x.n===1&&rows.length>1).sort((a,b)=>b.p-a.p)[0];
  const mb=[...boost.entries()].sort((a,b)=>b[1]-a[1])[0];
  return {rows,pick,best,topRunner,diff,mb,diffOwner:diff?rows.find(m=>m.by[r].squad.includes(diff.i)):null};
}
function leagueDetail(code){
  const st=standings(code),{rows,rs,cur}=st;
  const sub=(k,l)=>`<button class="btn ${lgSub===k?"on":""}" data-lgsub="${k}">${l}</button>`;
  const head=`<div class="lghead"><button class="btn quiet" data-lgback="1">← All leagues</button>
   <div class="lgtitle"><h2 style="margin:0">${esc(lgName(code))}</h2>${myOwn[code]?`<span class="host">You host</span>`:""}</div>
   <div class="codebox"><code>${esc(code)}</code><button class="btn on" data-copy="${esc(code)}">${copied===code?"Link copied":"Copy invite link"}</button>${navigator.share?`<button class="btn" data-share="${esc(code)}">Share</button>`:""}</div>
   ${cur!==undefined?`<div class="chips" style="margin-top:12px">${sub("table","Table")}${sub("round","Round")}${sub("teams","Teams")}</div>`:""}</div>`;
  if(cur===undefined||lgSub==="table")return head+`<div class="card">${leagueTable(code)}${cur!==undefined?`<p class="note" style="margin:10px 0 0">Tap a manager to see their team. Squads show once a round has started.</p>`:""}</div>`;
  const r=lgRound!==null&&rs.includes(lgRound)?lgRound:cur,ix=rs.indexOf(r),S=lgStats(code,r),live=!isFinal(r);

  if(lgSub==="teams")return head+nav+`<div class="grid2">${S.rows.slice().sort((a,b)=>b.by[r].total-a.by[r].total).map((m,k)=>teamCard(code,m,r,k)).join("")||'<div class="card">Nobody had a squad in this round.</div>'}</div>`;
  const ranked=S.rows.slice().sort((a,b)=>b.by[r].total-a.by[r].total);
  const hl=(k,v,s2)=>`<div class="hl"><span>${k}</span><b>${v}</b><span class="sub">${s2}</span></div>`;
  const hlsHtml=`
    ${S.best&&S.best.by[r].total>0?hl("Manager of the round",esc(S.best.name),fp(S.best.by[r].total)+" points"):""}
    ${S.topRunner&&S.topRunner.p>0?hl("Best runner picked",esc(nameOf(S.topRunner.i)),sg(S.topRunner.p)+", in "+S.topRunner.n+" of "+S.rows.length+" teams"):""}
    ${S.diff&&S.diff.p>0&&(!S.topRunner||S.diff.i!==S.topRunner.i||S.rows.length>2)?hl("Best differential",esc(nameOf(S.diff.i)),sg(S.diff.p)+", only "+esc(S.diffOwner.name)):""}
    ${S.mb&&S.mb[1]>1?hl("Most boosted",esc(nameOf(S.mb[0])),S.mb[1]+" of "+S.rows.length+" managers"):""}`;
  return head+nav+(hlsHtml.trim()?`<div class="hls">${hlsHtml}</div>`:"")+`   <div class="grid2"><div class="card"><h3>Round ranking</h3>${ranked.map((m,k)=>{const x=m.by[r];return `<div class="ev" data-mgr="${esc(code)}|${esc(m.id)}" style="cursor:pointer"><span style="display:flex;gap:10px;align-items:center">${k+1}. ${mgrDot(m)}<span><b>${esc(m.name)}</b><span class="sub" style="display:block">Boost ${esc(nameOf(x.captain))}${x.capLive===null?" (did not race)":" "+sg(x.capExtra)}${x.chip?", "+(x.chip==="tc"?"3x Boost":"Wildcard"):""}${x.penalty?", -"+fp(x.penalty)+" transfers":""}${x.carried?", squad carried over":""}</span></span></span><b>${fp(x.total)}</b></div>`}).join("")}</div>
   <div class="card"><h3>Who picked whom</h3>${S.pick.slice(0,12).map(x=>`<div class="ev"><span style="display:flex;gap:10px;align-items:center">${avatar(x.i,"sm")}<span><button class="who" style="font-size:14.5px" data-prof="${x.i}">${esc(nameOf(x.i))}</button><span class="sub" style="display:block">${Math.round(x.n/S.rows.length*100)}% of teams${x.started?"":", did not race"}</span></span></span><b class="${x.p<0?"neg":x.p>0?"pos":""}">${sg(x.p)}</b></div>`).join("")}</div></div>`;
}
function teamCard(code,m,r,k){

   ${x.carried?`<p class="note">No squad was locked for this round, so the squad from the round before played.</p>`:""}${x.chip==="wc"?`<p class="note">Wildcard played: transfers were free this round.</p>`:""}

   ${me&&me.id!==id&&me.by[r]?(()=>{const a=new Set(me.by[r].squad),both=x.squad.filter(i=>a.has(i)),only=x.squad.filter(i=>!a.has(i)),mine=me.by[r].squad.filter(i=>!x.squad.includes(i));

/* square crop and re-encode in the browser: small upload, no EXIF or GPS data */
function cropPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error("Choose an image file."));return}
    if(file.size>25e6){rej(new Error("That file is too large."));return}
    const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const n=Math.min(img.naturalWidth,img.naturalHeight);if(n<120){URL.revokeObjectURL(u);rej(new Error("That photo is too small. Use one at least 120 pixels wide."));return}
      const S=Math.min(512,n),c=document.createElement("canvas");c.width=c.height=S;
      const sx=(img.naturalWidth-n)/2,sy=Math.max(0,(img.naturalHeight-n)*.3);
      c.getContext("2d").drawImage(img,sx,sy,n,n,0,0,S,S);URL.revokeObjectURL(u);
      c.toBlob(b=>b?res({blob:b,url:c.toDataURL("image/jpeg",.6)}):rej(new Error("Could not read that photo.")),"image/jpeg",.86)};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Could not read that photo."))};img.src=u;
  });
}

  Object.keys(picks).forEach(r=>{if(+r<o&&!sp[r])delete picks[r]});

  const push=Object.keys(picks).filter(r=>+r>=o).map(r=>Object.assign({user_id:cloud.uid,round:+r,updated_at:new Date().toISOString()},idsOf(picks[r])));
  const drop=Object.keys(srv).filter(r=>+r>=o&&!picks[r]);
  if(push.length){const u=await cloud.sb.from("lineups").upsert(push);if(u.error)syncMsg="Your squad is saved on this device, but not to your account yet."}

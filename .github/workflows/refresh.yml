name: Refresh data

on:
  schedule:
    - cron: "17 4 * * *"
  # live runs (live: "1") are started every 15 minutes on race days by the database (pg_cron in Supabase): GitHub's own
  # schedule can be hours late, so it is only used for the nightly run
  workflow_dispatch:
    inputs:
      live:
        description: "1 = live run: only today's races, only from liveresultat"
        required: false
        default: ""
      redeploy:
        description: "1 = also call the Vercel deploy hook (only needed if a push did not deploy)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Restore result cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/results
          key: results-${{ github.run_id }}
          restore-keys: results-
      # liveresultat class lists of finished races, kept so they are not asked for again every night
      - name: Restore class list cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/classes.json
          key: classes-${{ github.run_id }}
          restore-keys: classes-
      # the competition list from the last run, used when liveresultat does not answer
      - name: Restore competition list cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/comps.json
          key: comps-${{ github.run_id }}
          restore-keys: comps-
      # Eventor's cache is kept apart, so the liveresultat cache above stays the same and is never thrown away
      - name: Restore Eventor cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/eventor
          key: eventor-${{ github.run_id }}
          restore-keys: eventor-
      # O-Ringen's birth years and club countries: finished years never change, so they are fetched once and kept here
      # (in the Actions cache, never in the repository: birth years are personal data)
      - name: Restore O-Ringen cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/oringen
          key: oringen-${{ github.run_id }}
          restore-keys: oringen-
      - name: Build
        env:
          TZ: Europe/Stockholm
          # only used as a request header to eventor.orientering.se; GitHub masks it in logs and it is never written out
          EVENTOR_API_KEY: ${{ secrets.EVENTOR_API_KEY }}
          # sends the rounds' lock times to the database; kept in Supabase's Vault as round_sync_key and copied here
          ROUND_SYNC_KEY: ${{ secrets.ROUND_SYNC_KEY }}
          # the quarter-hourly runs only ask liveresultat for today's races
          LIVE: ${{ inputs.live == '1' && '1' || '' }}
          # the site reads the game data from the data branch; test runs on other branches use data-preview
          DATA_BRANCH: ${{ github.ref == 'refs/heads/main' && 'data' || 'data-preview' }}
        run: bash pipeline/refresh.sh
      # The game data goes out on its own: game.json on the data branch, which the site downloads from GitHub. New
      # results then never need a new deploy of the site (Vercel only deploys when the page itself changes). The branch
      # holds one commit, replaced each time, so the repository does not grow. Before the page is committed, so a page
      # that reads its data from the branch never goes out ahead of the data.
      - name: Publish game data
        env:
          DATA_BRANCH: ${{ github.ref == 'refs/heads/main' && 'data' || 'data-preview' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -f pipeline/data/published_game.json ] && cmp -s pipeline/build/data.json pipeline/data/published_game.json; then echo "Game data unchanged"; exit 0; fi
          d="$(mktemp -d)"; cp pipeline/build/data.json "$d/game.json"; cd "$d"
          # Vercel reads its settings from the branch itself: this one is never deployed
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git init -q -b "$DATA_BRANCH"; git add game.json vercel.json
          git -c user.name="github-actions[bot]" -c user.email="41898699+github-actions[bot]@users.noreply.github.com" commit -q -m "Game data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$DATA_BRANCH"
          echo "Game data published to $DATA_BRANCH ($(wc -c < game.json) bytes)"
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "${{ inputs.live == '1' && 'Live' || 'Daily' }} data refresh $(date -u +%F)"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push
      # Vercel deploys every push to main, the bot's commits included, so the deploy hook would only deploy the same
      # commit a second time and use up the daily deploy limit (live runs come every 15 minutes on race days). It is
      # called only when asked for (redeploy: "1"), and never from another branch.
      - name: Redeploy on Vercel
        if: ${{ inputs.redeploy == '1' && github.ref == 'refs/heads/main' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then echo "No Vercel deploy hook set"; exit 0; fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Vercel redeploy started"

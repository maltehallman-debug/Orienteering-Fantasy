name: Refresh data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Restore result cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/results
          key: results-${{ github.run_id }}
          restore-keys: results-
      # Eventor's cache is kept apart, so the liveresultat cache above stays the same and is never thrown away
      - name: Restore Eventor cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/eventor
          key: eventor-${{ github.run_id }}
          restore-keys: eventor-
      - name: Build
        env:
          TZ: Europe/Stockholm
          # only used as a request header to eventor.orientering.se; GitHub masks it in logs and it is never written out
          EVENTOR_API_KEY: ${{ secrets.EVENTOR_API_KEY }}
        run: bash pipeline/refresh.sh
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily data refresh $(date -u +%F)"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push

name: Refresh data

on:
  schedule:
    - cron: "17 4 * * *"
  # live runs (live: "1") are started every 15 minutes on race days by the database (pg_cron in Supabase): GitHub's own
  # schedule can be hours late, so it is only used for the nightly run
  workflow_dispatch:
    inputs:
      live:
        description: "1 = live run: only today's races, only from liveresultat"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Restore result cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/results
          key: results-${{ github.run_id }}
          restore-keys: results-
      # liveresultat class lists of finished races, kept so they are not asked for again every night
      - name: Restore class list cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/classes.json
          key: classes-${{ github.run_id }}
          restore-keys: classes-
      # the competition list from the last run, used when liveresultat does not answer
      - name: Restore competition list cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/comps.json
          key: comps-${{ github.run_id }}
          restore-keys: comps-
      # Eventor's cache is kept apart, so the liveresultat cache above stays the same and is never thrown away
      - name: Restore Eventor cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/eventor
          key: eventor-${{ github.run_id }}
          restore-keys: eventor-
      - name: Build
        env:
          TZ: Europe/Stockholm
          # only used as a request header to eventor.orientering.se; GitHub masks it in logs and it is never written out
          EVENTOR_API_KEY: ${{ secrets.EVENTOR_API_KEY }}
          # sends the rounds' lock times to the database; kept in Supabase's Vault as round_sync_key and copied here
          ROUND_SYNC_KEY: ${{ secrets.ROUND_SYNC_KEY }}
          # the quarter-hourly runs only ask liveresultat for today's races
          LIVE: ${{ inputs.live == '1' && '1' || '' }}
        run: bash pipeline/refresh.sh
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "${{ inputs.live == '1' && 'Live' || 'Daily' }} data refresh $(date -u +%F)"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push
      # Vercel builds on every push, but may skip commits made by the GitHub bot; its deploy hook makes sure the new
      # data goes live. Does nothing until the VERCEL_DEPLOY_HOOK secret is set.
      - name: Redeploy on Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then echo "No Vercel deploy hook set"; exit 0; fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Vercel redeploy started"

name: Eventor probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe (prints structure only, never the key)
        env:
          EVENTOR_API_KEY: ${{ secrets.EVENTOR_API_KEY }}
          TZ: Europe/Stockholm
        run: python3 pipeline/scripts/eventor_probe.py
